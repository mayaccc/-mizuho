<style>
:root{
 --font:"Google Sans","Roboto","Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
 --primary:#3a5ba9;--on-primary:#fff;--primary-container:#dbe1ff;--on-primary-container:#001849;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface);color:var(--on-surface);font:400 14px/1.55 var(--font);-webkit-tap-highlight-color:transparent;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}

.row1{display:flex;align-items:center;gap:6px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:17px;font-weight:500;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:12px;color:var(--on-surface-variant)}
.ib{width:40px;height:40px;border-radius:20px;border:0;background:transparent;font-size:19px;display:grid;place-items:center}
.ib:hover{background:var(--sc-high)}
.row2{display:flex;align-items:center;gap:8px;margin-top:6px;overflow-x:auto;scrollbar-width:none}
.row2::-webkit-scrollbar{display:none}
.btn{border:0;border-radius:20px;height:40px;padding:0 20px;font-weight:500;background:var(--primary);color:var(--on-primary);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}

.btn.err{background:var(--error-container);color:var(--on-error-container)}

.btn:active:not(:disabled){filter:brightness(.92)}

.neg{color:var(--error)}.pos{color:var(--good)}.warn{color:var(--warn)}.mut{color:var(--on-surface-variant)}
#tick{margin:8px 12px 0;padding:8px 14px;background:var(--tertiary-container);color:var(--on-tertiary-container);border-radius:12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#view{padding:12px;max-width:1100px;margin:0 auto}
.card{background:var(--sc);border-radius:16px;padding:14px 16px;margin-bottom:12px}

.card h3 small{font-size:12px;font-weight:400;color:var(--on-surface-variant)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:0 12px;align-items:start}
.seg{display:flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;font-weight:500;color:var(--on-surface);border-right:1px solid var(--outline)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--secondary-container);color:var(--on-secondary-container)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--outline);background:transparent;font-size:13px;white-space:nowrap}
.chip.on{background:var(--secondary-container);border-color:transparent;color:var(--on-secondary-container)}
.tag{display:inline-block;font-size:11px;line-height:18px;padding:0 7px;border-radius:9px;background:var(--sc-highest);color:var(--on-surface-variant);margin-left:4px;vertical-align:1px}
.tag.r{background:var(--error-container);color:var(--on-error-container)}.tag.g{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}.tag.y{background:var(--primary-container);color:var(--on-primary-container)}
.li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--outline-variant)}
.li:last-child{border-bottom:0}
.li.clk{cursor:pointer}.li.clk:active{background:var(--sc-high)}
.li .ic{width:38px;height:38px;border-radius:19px;background:var(--secondary-container);display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.li .m{flex:1;min-width:0}.li .t{font-weight:500;overflow:hidden;text-overflow:ellipsis}.li .s{font-size:12.5px;color:var(--on-surface-variant)}
.li .tr{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.bar .bl{width:74px;flex:0 0 auto;color:var(--on-surface-variant)}.bar .bt{flex:1;height:8px;background:var(--sc-highest);border-radius:4px;overflow:hidden}
.bar .bf{display:block;height:100%;border-radius:4px;background:var(--primary)}.bar .bn{min-width:64px;text-align:right;white-space:nowrap}
.sl{margin:12px 0}.sl .h{display:flex;justify-content:space-between;gap:8px;font-weight:500}.sl .h b{color:var(--primary);font-weight:500}
.sl .hint{font-size:12px;color:var(--on-surface-variant)}
input[type=range]{width:100%;accent-color:var(--primary);height:30px;margin:2px 0}
canvas{width:100%;height:120px;display:block}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0;background:var(--sc-highest)}
.leg{font-size:12px;color:var(--on-surface-variant);display:flex;flex-wrap:wrap;gap:2px 12px}.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--outline-variant);font-size:13.5px}.kv span:first-child{color:var(--on-surface-variant)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.lg{padding:8px 2px;border-bottom:1px solid var(--outline-variant);font-size:13.5px}.lg .d{display:block;font-size:11px;color:var(--on-surface-variant)}
.lg.bad{color:var(--error)}.lg.good{color:var(--good)}.lg.conf{color:var(--warn)}

.opt button:disabled:not(.on){opacity:.45}

#mapsvg{width:100%;height:auto;max-height:68vh;display:block;touch-action:manipulation}
#mapsvg .rg{cursor:pointer;stroke:var(--surface);stroke-width:2.5;stroke-linejoin:round;transition:filter .15s}

#sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--sc-low);border-radius:28px 28px 0 0;padding:6px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,0,0,1);overscroll-behavior:contain}
#sheet.show{transform:none}
#sheet .grab{width:32px;height:4px;border-radius:2px;background:var(--outline);margin:6px auto 10px;opacity:.6}
#sheet h2{margin:4px 0 8px;font-size:20px;font-weight:500}
#toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
#toast div{background:var(--inverse-surface);color:var(--inverse-on-surface);padding:11px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#toast div.err{background:var(--error-container);color:var(--on-error-container)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.sw{width:42px;height:42px;border-radius:21px;border:3px solid transparent}.sw.on{border-color:var(--on-surface)}
.pcard{display:block;width:100%;text-align:left;border:1px solid var(--outline-variant);background:var(--sc);border-radius:16px;padding:12px 14px;margin:8px 0}
.pcard.on{border:2px solid var(--primary);padding:11px 13px;background:var(--primary-container)}
@media (min-width:840px){
 body{padding-bottom:24px}

 #top{padding-left:100px}
 #kpis,#tick,#view{margin-left:88px}
 #tick{margin-right:12px}
 #view{max-width:1180px;margin-right:auto}

 #sheet.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
 #toast{bottom:24px}
}

.ei{width:1.18em;height:1.18em;fill:currentColor;vertical-align:-.22em;flex:0 0 auto}.li .ic{color:var(--on-secondary-container)}.li .ic .ei{width:20px;height:20px;vertical-align:0}
.seg{overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{white-space:nowrap;padding:9px 12px;flex:1 0 auto}.ei-h .ei{width:1.1em;height:1.1em}

.tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--outline-variant);margin:0 0 14px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;position:relative;border:0;background:transparent;padding:13px 16px;font-size:14px;font-weight:500;color:var(--on-surface-variant);white-space:nowrap;transition:color .15s}
.tabs button.on{color:var(--primary)}
.tabs button.on::after{content:'';position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
@media(min-width:900px){.tabs button{flex:1 0 auto}}

.tabs.fit button{flex:1 1 0;padding:13px 2px;font-size:13px;text-align:center;min-width:0}.tabs.fit button.on::after{left:6px;right:6px}

</style>
</head>

function ctrlZ(c){const k=ctrlKey(c);if(k&&k[0]==='z'){const z=zOf(k);return z&&z.alive?z:null;}
 let best=null,bv=c.S*.3;for(const kk in c.hold){if(kk[0]==='z'&&c.hold[kk]>=bv){const z=zOf(kk);if(z&&z.alive){bv=c.hold[kk];best=z;}}}return best;}
function relKey(a,b){return a.id<b.id?a.id+'_'+b.id:b.id+'_'+a.id;}
function relGet(a,b){return G.rel[relKey(a,b)]||0;}
function relSet(a,b,v){G.rel[relKey(a,b)]=clamp(v,-100,100);}
function relAdd(a,b,d){relSet(a,b,relGet(a,b)+d);}
function ok(m){return {ok:true,m};}
function err(m){return {ok:false,m};}

function demand(sec){const s=SECT[sec];const popF=G.pop/3500;
 let d=s.base*popF*(s.a+s.b*G.infra/100+s.c*G.tech/100+s.d*G.edu/100)*(1+.45*G.cycle)*(G.em[sec]||1)*((G.fx&&G.fx.dem[sec])||1);
 if(sec==='trade')d*=1-G.tariff*.6;
 return d;}
function unlocked(sec){return G.tech>=SECT[sec].ut;}
function sectorK(sec,size){const D=G.sec[sec]?G.sec[sec].D:demand(sec);return Math.round(Math.max(300,D/SECT[sec].capr*.1)*size);}

function mkName(prefix,sec){const sf=SECT[sec].suf;
 for(let i=0;i<24;i++){const n=prefix+pick(sf);if(!G.companies.some(c=>c.alive&&c.name===n))return n;}
 return prefix+SECT[sec].n+G.nextId;}
function fairMC(c){const E=Math.max(0,c.K+c.cash-c.debt);
 const f=c.earn>0?.55*E+40*c.earn:.35*E+12*c.earn;return Math.max(E*.08+1,f);}
function fairPrice(c){return fairMC(c)*1e4/c.S*(1+.3*G.sent);}

function mkZ(name,cash){const z={id:G.nextZ++,name,cash,agg:rnd(),alive:true,idle:0,born:G.t,n:0,K:0};z.key='z'+z.id;
 G.zs.forEach(o=>{if(o.alive)relSet(z,o,Math.round((rnd()-.5)*30));});G.zs.push(z);return z;}

function mkCo(sec,owner,K,init,reg){
 const z=typeof owner==='number'?G.zs.find(x=>x.id===owner):null;
 const prefix=owner==='state'?(G.year>=1946?'国営':'官営'):z?z.name:pick(FN);
 const c={id:G.nextId++,name:mkName(prefix,sec),sector:sec,K,cash:K*.25,debt:0,q:clamp(.2+rnd()*.3+G.tech/300,0,1),rep:0,lev:.2+.8*rnd(),
  S:SH,earn:K*.04,rev:0,profit:0,pre:0,lossQ:0,util:.8,alive:true,listed:false,hold:{},price:1,ph:[],chg:0,born:G.t,endT:0,reg:reg||(G.reg?pickRegion(sec):null)};
 c.hold=owner==='state'?{state:SH}:z?{[z.key]:SH}:{pub:SH};
 c.price=Math.max(1,fairPrice(c));c.ph=[c.price];
 if(init&&K>=650){c.listed=true;if(z){const n=Math.floor(SH*.35);c.hold[z.key]-=n;c.hold.pub=n;}}
 G.companies.push(c);return c;}

function seed(sec,owners){const D=demand(sec),tot=D/SECT[sec].capr*1.0;
 owners.forEach(o=>{mkCo(sec,o,Math.round(tot/owners.length*(.8+.4*rnd())),true);});}

function newGame(pid,opts){
 G={ver:2,t:0,year:1880,q:1,treasury:3000,pop:3500,infra:8,edu:8,tech:10,wt:10,welfare:25,stab:72,
  tax:.15,tariff:.1,sp:{infra:.012,edu:.012,tech:.008,welfare:.01},
  cycle:0,sent:0,credit:.8,cs:0,unemp:0,conc:0,food:1,gdp:6000,inf:1400,gdpH:[],popH:[],idxH:[],stH:[],

  fin:{inc:0,spend:0,net:0,corp:0,hh:0,tar:0,div:0},dead:[],over:null,big:false,sec:{},rate:.015,ms:{},corpTax:0,divIn:0,peak:0,bankrupts:0};
 [...ZN].sort(()=>rnd()-.5).slice(0,3).forEach(n=>mkZ(n,700+Math.round(rnd()*300)));
 const [a,b,c]=G.zs.map(z=>z.id);
 seed('agri',[a,b,c,null,null]);
 seed('textile',['state',b,c,null]);
 seed('trade',[a,b,null]);
 seed('bank',[a,c]);
 seed('fishery',[b,null]);
 seed('food',[c,null]);
 seed('press',[a,null]);
 for(const sec in SECT){G.sec[sec]={D:demand(sec),rev:0,cap:0,u:.8,n:G.companies.filter(x=>x.sector===sec).length,mg:SECT[sec].m,unmet:0};}
 polInit(pid,opts);
 G.gdpH.push(G.gdp);G.popH.push(G.pop);G.idxH.push(G.idx);G.stH.push(G.stab);
 news('🏛️ 瑞穂国、近代化への第一歩。証券取引所が開設され、三つの財閥が産声を上げた。','info');

 {w:5,f(){const zs=G.zs.filter(z=>z.alive);if(!zs.length)return;const z=pick(zs);z.cash*=.8;G.sent-=.15;G.stab-=2;news(`🕵️ ${z.name}財閥の汚職が発覚。政府への信頼が揺らぐ。`,'bad');}},
 {w:2.5,f(){G.cycle=Math.min(G.cycle,-.7);G.sent-=.6;G.cs-=.2;news('🌐 世界恐慌。輸出が急減し、景気が冷え込む。','bad',true);}},
 {w:5,f(){G.cycle=Math.max(G.cycle,.6);news('☀️ 好景気。民間の投資意欲が高まる。','good');}}

function worldStep(){
 G.wt=Math.min(100,10+(G.year-1880)*.95+(G.q-1)*.24);
 G.cycle=clamp(.9*G.cycle+gauss()*.26,-1,1);
 for(const s in G.emt){if(G.emt[s]>0&&--G.emt[s]<=0){G.em[s]=1;}}
 if(rnd()<.22){const tw=EVENTS.reduce((a,e)=>a+e.w,0);let r=rnd()*tw;for(const e of EVENTS){r-=e.w;if(r<=0){e.f();break;}}}
 const pf=clamp(G.food,.6,1.2);
 G.pop*=1+.0028+.003*(pf-1)+.000025*G.welfare+.00002*G.infra-.0006*G.unemp;
}

/* ---- 経済(売上・利益・投資・破産) ---- */
function injectEquity(c,key,amt){const n=Math.floor(amt*1e4/Math.max(c.price,1));c.S+=n;c.hold[key]=(c.hold[key]||0)+n;c.cash+=amt;}
function payDiv(c,dv){c.cash-=dv;c.dvq=(c.dvq||0)+dv;if(c.hold.priv&&G.priv)G.priv.cash+=dv*c.hold.priv/c.S;for(const k in c.hold){const a=dv*c.hold[k]/c.S;if(k==='state')G.divIn+=a;else if(k[0]==='z'){const z=zOf(k);if(z&&z.alive)z.cash+=a;}else if(k[0]==='u'&&G.funds){const fu=fundOf(k);if(fu){fu.cash+=a;if(fu.origin!=='dom')G.fdiv+=a;}}else if(k[0]==='g'){const p=co(+k.slice(1));if(p&&p.alive)p.cash+=a;}}}
function bail(c){const need=-c.cash+.1*c.K;{const gk2=ctrlKey(c);if(gk2&&gk2[0]==='g'){const gp=co(+gk2.slice(1));if(gp&&gp.alive&&gp.cash>need*1.3){gp.cash-=need;injectEquity(c,gk2,need);news(`🤝 ${gp.name}が子会社の${c.name}に${fm(need)}を資金援助`,'conf');}}}
 if((c.hold.state||0)>=c.S*.4&&G.treasury>need*.5){const a=Math.min(need,G.treasury*.5);G.treasury-=a;injectEquity(c,'state',a);news(`🏛️ 政府が${c.name}に${fm(a)}を注入(官営救済)`,'conf');}
 if(c.cash<0){const z=ctrlZ(c);if(z&&z.cash>need*1.1&&rnd()<(c.K>350?.9:.5)){z.cash-=need;injectEquity(c,z.key,need);news(`🤝 ${z.name}財閥が${c.name}に${fm(need)}を資金援助`,'conf');}}}
function bankrupt(c){
 if(c.alive&&ctrlKey(c)==='state'){stateRescue(c);return;}
 c.alive=false;c.endT=G.t;G.bankrupts++;
 const banks=G.companies.filter(k=>k.alive&&k.sector==='bank'&&k!==c);
 const loss=Math.max(0,c.debt-c.K*.3);
 if(loss>0&&banks.length){const bk=banks.reduce((a,k)=>a+k.K,0);banks.forEach(k=>{k.cash-=loss*k.K/bk;});}
 const totK=G.companies.filter(k=>k.alive).reduce((a,k)=>a+k.K,0)+c.K;const share=c.K/totK;
 G.unemp=clamp(G.unemp+share*1.5+.005,0,.6);{const rg=G.reg&&c.reg?regOf(c.reg):null;if(rg)rg.unrest=Math.min(100,rg.unrest+4+share*60);}G.stab=clamp(G.stab-1-share*25,0,100);G.sent=clamp(G.sent-.06-share*1.5,-1,1);
 if(c.sector==='bank'){G.cs-=.25;news(`🏦 ${c.name}が取り付け騒ぎで破綻。金融不安が広がる。`,'bad',true);}
 if(c.listed)G.idxLoss+=c.price*c.S/1e4;
 G.riv=G.riv.filter(r=>r.a!==c.id&&r.b!==c.id);
 const ck=ctrlKey(c);const ow=ck==='state'?'官営':ck&&ck[0]==='z'&&zOf(ck)?zOf(ck).name+'財閥系':ck&&ck[0]==='g'&&co(+ck.slice(1))?co(+ck.slice(1)).name+'系':'独立系';
 G.dead.unshift({name:c.name,sector:c.sector,y:G.year,q:G.q,debt:c.debt,K:c.K,ow});if(G.dead.length>40)G.dead.length=40;
 news(`💥 ${c.name}(${ow})が破産。負債${fm(c.debt)}、従業員${typeof staffOf==='function'?staffTxt(staffOf(c)):''}が失業。`,'bad',share>.05||c.K>1500);}

function econStep(){
 const al=G.companies.filter(c=>c.alive);
 const totK=al.reduce((a,c)=>a+c.K,0)||1;
 const bankK=al.filter(c=>c.sector==='bank').reduce((a,c)=>a+c.K,0);
 G.cs*=.9;
 G.credit=clamp(.2+.55*Math.min(1,bankK/(.12*totK))+.25*(G.sent+1)/2+G.cs+G.fx.credit,.1,1.2);
 G.rate=.01+.014*(1-G.credit/1.2)+(G.cur?(G.cur.polRate-.04)*.25:0)+(G.fx.rate||0);
 const pw={};G.riv.forEach(r=>{pw[r.a]=r;pw[r.b]=r;});
 let gdpC=0,corp=0;
 for(const sec in SECT){
  const s=SECT[sec],cs=al.filter(c=>c.sector===sec),D=demand(sec);
  if(!cs.length){G.sec[sec]={D,rev:0,cap:0,u:0,n:0,mg:0,unmet:D};continue;}
  const cap=cs.map(c=>c.K*s.capr*(.7+.3*G.stab/100)*(c.reg&&G.reg?(.55+.45*regOf(c.reg).ctrl):1));
  const w=cs.map(c=>{let x=c.K*(.5+c.q)*(1+.2*c.rep);const r=pw[c.id];if(r)x*=(r.win===c.id?1.3:.75);return x;});
  const rev=cs.map(()=>0);let rem=D,open=cs.map((_,i)=>i);
  for(let it=0;it<5&&rem>1&&open.length;it++){
   const sw=open.reduce((a,i)=>a+w[i],0);let used=0;
   for(const i of open){const add=Math.min(cap[i]-rev[i],rem*w[i]/sw);rev[i]+=add;used+=add;}
   rem-=used;open=open.filter(i=>cap[i]-rev[i]>1e-6);}
  const tr=rev.reduce((a,b)=>a+b,0),tc=cap.reduce((a,b)=>a+b,0),u=tr/tc;
  let mg=s.m*(.15+1.1*u)*(1+.25*G.cycle);if(rem>1)mg*=1+Math.min(.3,rem/D);
  if(MANU.includes(sec))mg*=1+(G.tech<G.wt?.25:-.1)*G.tariff*1.2;
  mg=clamp(mg*(G.fx.mg[sec]||1),.03,.5);
  G.sec[sec]={D,rev:tr,cap:tc,u,n:cs.length,mg,unmet:Math.max(0,rem)};
  cs.forEach((c,i)=>{
   const m=clamp(mg*(.75+.5*c.q)-(pw[c.id]?.12:0),-.15,.6);
   const pr=rev[i]*m-.016*c.K-c.debt*G.rate;
   const tax=pr>0?pr*Math.min(.6,2*G.tax):0;corp+=tax;
   c.rev=rev[i];c.pre=pr;c.profit=pr-tax;c.earn=.7*c.earn+.3*c.profit;c.cash+=c.profit;c.util=u;gdpC+=rev[i];
  });
 }
 G.inf=G.pop*.35*(1+.01*(G.edu+G.infra));
 G.gdp=gdpC+G.inf;G.corpTax=corp;
 const ag=G.sec.agri;G.food=ag&&ag.D>0?clamp((ag.rev+.3*ag.D)/ag.D,0,1.3):1;
 // 企業の意思決定
 for(const c of al){
  if(!c.alive)continue;
  const u=c.util;
  c.q=clamp(c.q+(G.tech/100*.9-c.q)*.02+gauss()*.008,.05,1);
  c.rep=clamp(c.rep*.95+(c.profit>0?.03:-.05),-1,1);
  c.lossQ=c.profit<0?c.lossQ+1:0;
  c.K*=.997;
  if(c.cash>.2*c.K&&c.profit>0){const dv=Math.min(c.cash-.2*c.K,.35*c.profit*(c.divX||1));if(dv>0)payDiv(c,dv);}
  if(c.debt>0&&c.cash>.35*c.K){const rp=Math.min(c.debt,c.cash-.3*c.K);c.cash-=rp;c.debt-=rp;}
  const ex=c.cash-.18*c.K;
  if(ex>0){const ratio=u>.9?.8:u>.8?.4:u>.65?.12:.03;const I=ex*ratio*(c.capX||1)*(1+.3*Math.max(0,G.sent));c.cash-=I;c.K+=I*.95;c.q=clamp(c.q+.02*I/Math.max(c.K,1),0,1);}
  if(u>.92&&G.credit>.55&&c.cash>0){const lim=c.K*.8*G.credit*c.lev-c.debt;if(lim>0&&rnd()<.7){const b=lim*.7;c.debt+=b;c.K+=b*.95;}}
  if(c.cash<0){
   const lim=c.K*.7*G.credit-c.debt;
   if(lim>0){const b=Math.min(-c.cash*1.15,lim);c.cash+=b;c.debt+=b;}
   if(c.cash<0)bail(c);
   if(c.cash<0)bankrupt(c);
  }else if(c.K<20||(c.lossQ>=8&&c.debt>c.K*.8&&c.cash<.05*c.K&&rnd()<.35)||(c.lossQ>=3&&c.debt>c.K*.35&&c.cash<.1*c.K&&!ctrlZ(c)&&ctrlKey(c)!=='state'&&rnd()<.3))bankrupt(c);
 }
}

/* ---- 企業間の対立 ---- */
function rivStep(){
 G.riv=G.riv.filter(r=>{const a=co(r.a),b=co(r.b);if(!a||!b||!a.alive||!b.alive)return false;
  if(--r.ttl<=0){const w=co(r.win);news(`🕊️ ${a.name}と${b.name}の価格戦争が終結。${w?w.name+'が優位に。':''}`,'conf');return false;}return true;});
 G.riv.forEach(r=>{const a=co(r.a),b=co(r.b);r.win=(a.cash/a.K+a.q)>=(b.cash/b.K+b.q)?a.id:b.id;});
 for(const sec in SECT){
  const cs=G.companies.filter(c=>c.alive&&c.sector===sec&&!G.riv.some(r=>r.a===c.id||r.b===c.id));
  if(cs.length<2||rnd()>.05)continue;
  const a=pick(cs),b=pick(cs.filter(x=>x!==a));
  G.riv.push({a:a.id,b:b.id,ttl:4+Math.floor(rnd()*5),win:a.id,sec});
  news(`⚔️ ${a.name}と${b.name}が${SECT[sec].n}業界で価格戦争に突入`,'conf');
 }
}

/* ---- 株式の売買 ---- */
function quote(c,n,dir){n=Math.max(0,Math.floor(n));if(dir>0)n=Math.min(n,c.hold.pub||0);
 const imp=Math.min(.6,n/c.S*(G.sent<-.5?1.8:1));const unit=c.price*(1+dir*imp*.5);return {n,imp,unit,amt:n*unit/1e4};}
function exec(c,key,n,dir){const q=quote(c,n,dir);if(!q.n)return q;
 c.hold.pub=(c.hold.pub||0)-dir*q.n;c.hold[key]=(c.hold[key]||0)+dir*q.n;if(c.hold[key]<=0)delete c.hold[key];
 if(c.hold.pub<=0)delete c.hold.pub;
 c.price=Math.max(1,c.price*(1+dir*q.imp*.6));return q;}

/* ---- 財閥AI ---- */
function bestSector(mine){let best=null,bs=-9;
 for(const s in SECT){if(!unlocked(s))continue;const x=G.sec[s];if(!x)continue;
  let sc=(x.unmet>x.D*.05?1:0)+(x.u>.9?.6:0)+x.mg*3+rnd()*.5-(mine.some(c=>c.sector===s)?.3:0)-(x.n>=5*Math.max(1,Math.sqrt(G.gdp/6000))?.8:0)-(x.u<.6&&x.n>0?1:0);
  if(x.n===0)sc+=.8;
  if(sc>bs){bs=sc;best=s;}}
 return bs>1.2?best:null;}
function zStep(){
 const sc=Math.max(1,G.gdp/6000);
 const zs=G.zs.filter(z=>z.alive);
 const al=G.companies.filter(c=>c.alive);
 const totK=al.reduce((a,c)=>a+c.K,0)||1;
 const cnt=(z,sec)=>al.filter(c=>c.sector===sec&&c.hold[z.key]>=c.S*.5).length;
 for(let i=0;i<zs.length;i++)for(let j=i+1;j<zs.length;j++){
  const a=zs[i],b=zs[j];let ov=0;
  for(const sec in SECT)ov+=Math.min(cnt(a,sec),cnt(b,sec))*(sec==='agri'?.3:1);
  const r=relGet(a,b);relSet(a,b,r-.9*ov*(.5+(a.agg+b.agg)/2)-r*.04+gauss()*2.5+(ov===0?.5:0));
 }
 let zk=0;
 for(const z of zs){
  const mine=al.filter(c=>c.alive&&c.hold[z.key]>=c.S*.5);
  z.n=mine.length;z.K=mine.reduce((a,c)=>a+c.K,0);zk+=z.K;
  // 新会社設立
  if(z.cash>1200*sc&&rnd()<.22){const s=bestSector(mine);
   if(s){const K=sectorK(s,1);if(z.cash>K*1.4){z.cash-=K;const c=mkCo(s,z.id,K);news(`🏭 ${z.name}財閥が${c.name}を設立`,'info');}}}
  // 上場
  for(const c of mine){if(!c.listed&&c.K>=800&&rnd()<.15){c.listed=true;const n=Math.floor(c.S*.3);const q=quote(c,n,-1);z.cash+=q.amt*.95;exec(c,z.key,n,-1);news(`📈 ${c.name}が株式を上場(${z.name}系)`,'info');}}
  // 買収
  if(z.cash>1500*sc&&rnd()<(.14+.2*z.agg)*G.fx.antiAcq){
   const cs2=al.filter(c=>c.alive&&c.listed&&(c.hold.pub||0)>c.S*.06&&(ctrlKey(c)===null||ctrlKey(c)==='pub')&&(c.hold[z.key]||0)<c.S*.5);
   if(cs2.length){cs2.sort((a,b)=>b.earn/b.K-a.earn/a.K+(rnd()-.5)*.02);const t=cs2[0];
    const n=Math.min(t.hold.pub,.15*t.S);const q=quote(t,n,1);
    if(z.cash>=q.amt*1.05+300&&q.n>0){const before=t.hold[z.key]||0;z.cash-=q.amt;exec(t,z.key,q.n,1);const after=t.hold[z.key]||0;
     if(before<t.S*.5&&after>=t.S*.5)news(`🏯 ${z.name}財閥が${t.name}を買収、傘下に収めた`,'conf',t.K>1500);
     else if(before<t.S*.2&&after>=t.S*.2)news(`💼 ${z.name}財閥が${t.name}の大株主に`,'info');}}}
  // 財閥間抗争
  for(const o of zs){
   if(o===z)continue;const r=relGet(z,o);
   if(r<-35&&rnd()<.1+z.agg*.25+(r<-70?.2:0)){
    const kind=pick(['pw','sab','tob','tob']);
    const oc=al.filter(c=>c.alive&&c.hold[o.key]>=c.S*.5);

      news(`🔥 ${t.name}で原因不明の火災(損害${fm(d)})。${z.name}財閥の関与が噂される。`,'conf');}}
    else if(kind==='pw'){const pairs=[];mine.forEach(a=>oc.forEach(b=>{if(a.sector===b.sector&&!G.riv.some(r2=>r2.a===a.id||r2.b===a.id||r2.a===b.id||r2.b===b.id))pairs.push([a,b]);}));
     if(pairs.length){const [a,b]=pick(pairs);G.riv.push({a:a.id,b:b.id,ttl:5+Math.floor(rnd()*5),win:a.id,sec:a.sector});
      news(`⚔️ ${z.name}と${o.name}の財閥対立が激化。${a.name}と${b.name}が全面的な価格戦争へ。`,'conf');}}
    else{const tg=oc.filter(c=>c.listed);if(tg.length){const t=pick(tg);
      if(o.cash<200*sc&&(t.hold[o.key]||0)>0){const n=Math.min(t.hold[o.key],.25*t.S);const amt=n*t.price*1.3/1e4;
       if(z.cash>=amt){z.cash-=amt;o.cash+=amt;t.hold[o.key]-=n;if(t.hold[o.key]<=0)delete t.hold[o.key];t.hold[z.key]=(t.hold[z.key]||0)+n;relAdd(z,o,-8);
        news(`🦅 資金難の${o.name}財閥から${t.name}の株を${z.name}財閥が買い取った`,'conf',true);}}
      else if((t.hold.pub||0)>t.S*.05){const n=Math.min(t.hold.pub,.12*t.S);const q=quote(t,n,1);

function startupStep(){

/* ---- 市場 ---- */
function marketStep(){
 const prev=G.gdpH.length?G.gdpH[G.gdpH.length-1]:G.gdp;
 const gr=(G.gdp-prev)/prev;
 G.sent=clamp(.9*G.sent+.35*clamp(gr*4,-1,1)+.12*G.cycle+gauss()*.07+G.fx.sent*.25,-1,1);
 if(G.sent>.7&&rnd()<(.05+.25*(G.sent-.7))*(G.fx&&G.fx.bubble||1)){G.sent-=1.1;G.cs-=.15;news('📉 株価大暴落！バブルが崩壊した。','bad',true);G.sent=clamp(G.sent,-1,1);}
 let sp=G.idxLoss,sd=-G.idxLoss;G.idxLoss=0;
 for(const c of G.companies){if(!c.alive)continue;
  const tgt=fairPrice(c)*bumpMul(c),old=c.price;const noise=c.listed?.035*gauss():0;
  c.price=Math.max(1,old+.28*(tgt-old)+old*noise);c.chg=c.price/old-1;c.dvh=c.dvh||[];c.dvh.push(c.dvq||0);c.dvq=0;if(c.dvh.length>4)c.dvh.shift();
  c.ph.push(c.price);if(c.ph.length>160)c.ph.shift();
  if(c.listed){sp+=old*c.S/1e4;sd+=(c.price-old)*c.S/1e4;}}
 if(sp>0)G.idx*=1+clamp(sd/sp,-.6,.6);
}

/* ---- 政府・財政 ---- */
function govStep(){
 const gdp=G.gdp;
 const hh=1.2*G.tax*G.inf,tar=G.tariff*.12*gdp*(1-.5*G.tariff);
 const inc=G.corpTax+hh+tar+G.divIn;
 let sp=0;for(const k in G.sp)sp+=G.sp[k]*gdp;const adm=.02*gdp+10+G.fx.insCost*gdp;
 G.fin={inc,spend:sp+adm,net:inc-sp-adm,corp:G.corpTax,hh,tar,div:G.divIn};
 G.treasury+=G.fin.net;
 if(G.treasury<0&&!G.mac)G.treasury*=1.015;
 const s=G.sp;
 G.infra=clamp(G.infra-G.infra*.004+24*s.infra*(1-G.infra/120),0,100);
 G.edu=clamp(G.edu+18*s.edu*(1-G.edu/120),0,100);
 const catchup=G.tech<G.wt?(G.wt-G.tech)*.006:0;
 G.tech=clamp(G.tech+Math.max(0,.06+.003*G.edu+20*s.tech*(1-G.tech/110)+catchup-G.tariff*.15),0,100);
 G.welfare=clamp(G.welfare+(Math.min(100,s.welfare*1500+G.fx.insW+(G.fx.welA||0))-G.welfare)*.12,0,100);
 G.unemp*=.85;
 const target=55+.35*G.welfare+.1*G.edu-120*Math.max(0,G.tax-.2)-40*uex()-30*Math.max(0,G.conc-.4)-(G.treasury<0?8:0)-(G.fx&&G.fx.stabPen||0);
 G.stab=clamp(G.stab+(target-G.stab)*.08,0,100);
 if(G.stab<=6){if(!oppCrisis('stab'))G.over={kind:'政変',msg:'民心は離れ、政府は倒れた。革命と混乱の中で、瑞穂国の近代化は頓挫した。'};}
 else if(G.treasury<-2.5*G.gdp){if(!oppCrisis('fin'))G.over={kind:'財政破綻',msg:'国債は信用を失い、国庫は底を突いた。外国債権者に財政を握られ、国の自立は失われた。'};}
}

function step(){
 if(G.over||G.elect)return;
 G.t++;G.q++;if(G.q>4){G.q=1;G.year++;}
 G.divIn=0;
 worldStep();econStep();rivStep();zStep();startupStep();marketStep();govStep();if(!G.over)polStep();
 G.gdpH.push(G.gdp);G.popH.push(G.pop);G.idxH.push(G.idx);G.stH.push(G.stab);
 for(const h of ['gdpH','popH','idxH','stH'])if(G[h].length>600)G[h].shift();
 G.peak=Math.max(G.peak,G.gdp);
 const ann=G.gdp*4/1e4;
 for(const th of [5,10,25,50,100,250,500,1000,2500,5000,10000]){if(ann>=th&&!G.ms[th]){G.ms[th]=1;if(G.t>1)news(`🎉 年換算GDPが${th>=10000?th/10000+'兆':th+'億'}円を突破！`,'good');}}
 if(G.year===1950&&G.q===1)news(`📜 建国70年。年換算GDP ${fm(G.gdp*4)}、人口${Math.round(G.pop).toLocaleString()}万人。ここまでの歩みが評価される。`,'info',true);
}

function pFound(sec,owner,size,reg){
 if(!unlocked(sec))return err('技術水準が足りず、まだその産業は興せません');
 const K=sectorK(sec,size);if(G.treasury<K)return err('国庫が足りません');
 const own=owner==='state'?'state':owner==='free'?null:Number(owner);
 if(typeof own==='number'&&!(G.zs.find(z=>z.id===own&&z.alive)))return err('その財閥は存在しません');
 G.treasury-=K;const c=mkCo(sec,own,K,false,reg||null);
 const wh=own==='state'?'官営':own===null?'民間(補助金)':zOf('z'+own).name+'財閥に託す';
 news(`🏭 ${c.name}を設立(${wh}、資本${fm(K)})`,'good');return ok(`${c.name}を設立しました(${fm(K)})`);}
function pSell(cid,frac){stAct(cid);const c=co(cid);if(!c||!c.alive)return err('会社が存在しません');if(!c.listed)return err('未上場です。先に上場してください');
 const n=Math.min(Math.floor(c.S*frac),c.hold.state||0);if(n<=0)return err('国有株がありません');
 const q=quote(c,n,-1);G.treasury+=q.amt;exec(c,'state',n,-1);news(`💴 政府が${c.name}株${(n/c.S*100).toFixed(0)}%を売却し${fm(q.amt)}を得た`,'info');return ok(`${fm(q.amt)}で売却しました`);}
function pBuy(cid,frac){stAct(cid);const c=co(cid);if(!c||!c.alive)return err('会社が存在しません');if(!c.listed)return err('未上場です');
 const q=quote(c,Math.floor(c.S*frac),1);if(!q.n)return err('市場に売り株がありません');if(q.amt>G.treasury)return err('国庫が足りません');
 G.treasury-=q.amt;exec(c,'state',q.n,1);return ok(`${(q.n/c.S*100).toFixed(1)}%を${fm(q.amt)}で取得`);}
function pList(cid){const c=co(cid);if(!c||!c.alive)return err('会社が存在しません');if(c.listed)return err('既に上場しています');if(c.K<500)return err('資本500万円以上が必要です');
 c.listed=true;news(`📈 ${c.name}が株式を上場`,'info');return ok('上場しました');}
function pCede(cid,zid){stAct(cid);const c=co(cid),z=G.zs.find(x=>x.id===zid&&x.alive);if(!c||!z)return err('対象が存在しません');
 const have=c.hold.state||0;if(!have)return err('国有株がありません');
 const unit=c.price*.7/1e4;const n=Math.min(have,Math.floor(z.cash/unit));if(n<=0)return err(`${z.name}財閥に資金がありません`);
 const amt=n*unit;z.cash-=amt;G.treasury+=amt;c.hold.state-=n;if(c.hold.state<=0)delete c.hold.state;c.hold[z.key]=(c.hold[z.key]||0)+n;
 news(`🏛️→🏯 官営の${c.name}を${z.name}財閥に払い下げ(${(n/c.S*100).toFixed(0)}%、${fm(amt)})`,'conf');return ok(`${z.name}財閥へ${fm(amt)}で払下げ`);}
function pInject(cid,frac){stAct(cid);const c=co(cid);if(!c||!c.alive)return err('会社が存在しません');const a=c.K*frac;if(G.treasury<a)return err('国庫が足りません');
 G.treasury-=a;injectEquity(c,'state',a);return ok(`${fm(a)}を出資しました`);}
function pCreateZ(){const sc=Math.max(1,G.gdp/6000),cost=1000*sc;if(G.treasury<cost)return err('国庫が足りません');
 const used=G.zs.map(z=>z.name);const pool=ZN.filter(n=>!used.includes(n));const name=pool.length?pick(pool):pick(FN)+'家';
 G.treasury-=cost;const z=mkZ(name,cost);news(`🏯 政府の肝煎りで${z.name}財閥が誕生`,'good');return ok(`${z.name}財閥を創設しました`);}
function pSubsidy(zid){const z=G.zs.find(x=>x.id===zid&&x.alive);const sc=Math.max(1,G.gdp/6000),cost=300*sc;if(!z)return err('財閥がありません');if(G.treasury<cost)return err('国庫が足りません');
 G.treasury-=cost;z.cash+=cost;G.stab=clamp(G.stab-.5,0,100);return ok(`${z.name}財閥に${fm(cost)}を支給`);}
function pDissolve(zid){const z=G.zs.find(x=>x.id===zid&&x.alive);if(!z)return err('財閥がありません');
 G.companies.forEach(c=>{if(c.hold[z.key]){c.hold.pub=(c.hold.pub||0)+c.hold[z.key];delete c.hold[z.key];}});
 z.alive=false;G.sent=clamp(G.sent-.35,-1,1);G.stab=clamp(G.stab+5,0,100);news(`⚖️ 政府が${z.name}財閥を解体。傘下企業は市場に放出された。`,'conf',true);return ok(`${z.name}財閥を解体しました`);}
function pMediate(aid,bid){const a=G.zs.find(x=>x.id===aid&&x.alive),b=G.zs.find(x=>x.id===bid&&x.alive);const sc=Math.max(1,G.gdp/6000),cost=150*sc;
 if(!a||!b)return err('財閥がありません');if(G.treasury<cost)return err('国庫が足りません');
 G.treasury-=cost;relAdd(a,b,45);G.riv=G.riv.filter(r=>{const x=co(r.a),y=co(r.b);if(!x||!y)return false;const kx=ctrlKey(x),ky=ctrlKey(y);return !((kx===a.key&&ky===b.key)||(kx===b.key&&ky===a.key));});
 news(`🤝 政府の仲裁で${a.name}と${b.name}が和解`,'good');return ok('仲裁が成立しました');}

function regStep(){
 const al=G.companies.filter(c=>c.alive),L=G.pl,f=G.fx;
 const totK=al.reduce((a,c)=>a+c.K,0)||1,sumPop=REG.reduce((a,r)=>a+r.popw,0);
 const wsum=G.reg.reduce((a,r)=>a+regDef(r.id).popw*(.4+r.dev/100),0);
 let ua=0;
 G.reg.forEach(r=>{
  const d0=regDef(r.id),cs=al.filter(c=>c.reg===r.id),pw=d0.popw/sumPop;
  r.K=cs.reduce((a,c)=>a+c.K,0);r.rev=cs.reduce((a,c)=>a+c.rev,0);
  const inf={};cs.forEach(c=>{const k=ctrlKey(c)||'ind';inf[k]=(inf[k]||0)+c.K;});
  let dk=null,dv=0;
  for(const k in inf){inf[k]/=Math.max(1,r.K);if(inf[k]>dv){dv=inf[k];dk=k;}}
  r.inf=inf;r.dom=dk;r.domS=dv;
  const dens=(r.K/totK)/pw;
  r.dev+=(clamp(100*(1-Math.exp(-.9*dens*(.35+G.infra/100))),0,100)-r.dev)*.06;
  const iw=d0.popw*(.4+r.dev/100)/wsum;
  r.imm=clamp(G.imm.share*iw/pw,0,.6);
  const unFrac=G.imm.share>.0005?G.imm.un/Math.max(G.imm.un,.01):0;
  const ag=(d0.bias.agri||.4)/2,ind=((d0.bias.textile||0)+(d0.bias.steel||0))/3;
  let d=uex()*30+(G.food<.9?(.9-G.food)*60*(.5+ag):0)-.05*(G.welfare-20)-.04*(G.stab-55);
  d+=f.landUnrest*ag+f.laborUnrest*(.4+ind)+f.pressUnrest+f.decenUnrest+f.consUnrest;
  d+=r.imm*unFrac*14*f.friction;
  if(warActive()&&d0.border&&neiOf(d0.border).war)d+=3.5;
  if(r.revolt>0)d+=2;
  d+=.035*G.fraud.heat;
  r.unrest=clamp(r.unrest*.92+d+gauss()*1.1,0,100);
  r.ctrl=clamp(r.ctrl+((1-Math.max(0,r.unrest-35)/80)-r.ctrl)*.15,.1,1);
  if(r.revolt>0){
   r.revolt--;cs.forEach(c=>{c.K*=.985;});r.dev*=.985;
   if(r.revolt===0){r.unrest=Math.min(r.unrest,62);news(`🕊️ ${d0.name}の反乱が鎮まった`,'info');}
  }else if(r.unrest>84&&rnd()<.35){
   r.revolt=5+Math.floor(rnd()*4);G.stab-=3;G.pol.approval-=.04;
   news(`🔥 ${d0.name}で大規模な反乱が発生！統治力が失われつつある`,'bad',true);
  }
  ua+=r.unrest*pw;
 });
 G.unrestAvg=ua;
}

function supStep(init){
 const pp=G.pol,L=G.pl;
 PARTIES.forEach(p=>{let s=0;POL.forEach(o=>{let x=1-Math.abs((L[o.k]==null?o.d0:L[o.k])/(o.lv.length-1)-p.ideal[o.k]);if(o.nw)x=o.sw*(x-(1-Math.abs(o.d0/(o.lv.length-1)-p.ideal[o.k])));s+=x;});G.sat[p.id]=s/POL.filter(o=>!o.nw).length;});

 G.zs.forEach(z=>{if(!z.party)z.party=pick(['seiyu','seiyu','minsei','kokusui']);});
 G.reg.forEach(r=>{
  const d0=regDef(r.id),sc={};let mx=-9;
  const dz=r.dom&&r.dom[0]==='z'?zOf(r.dom):null;
  PARTIES.forEach(p=>{
   let v=Math.log(Math.max(.02,d0.lean[p.id]!=null?d0.lean[p.id]:(p.lean&&p.lean[d0.id]!=null?p.lean[d0.id]:.04)));
   v+=(p.id===pp.ruling?1:-.3)*ap*2.2+satK(p.id)*(G.sat[p.id]-.55);
   if(p.id===pp.ruling){const dd=Math.max(0,.36-natLean(p.id));v+=.08+6*dd+18*dd*dd;}
   const u=r.unrest/100;
   if(p.id==='rodo')v+=u*1.0+.25*L.suff*(.4+(d0.bias.textile||0)/3);
   if(p.id==='kokusui')v+=u*.8+G.nat*.9+r.imm*3+(warActive()?.25:0);
   if(p.id==='seiyu'||p.id==='minsei')v-=u*.5;
   if(p.id==='seiyu')v-=.15*L.suff;
   if(p.id==='minsei')v+=r.dev/100*.35;
   if(dz&&dz.party===p.id)v+=.5*r.domS;
   v+=(G.media&&G.media.push&&G.media.push[p.id])||0;
   v+=(G.mood&&G.mood.push&&G.mood.push[p.id])||0;
   v+=(G.rel&&G.rel.push&&G.rel.push[p.id])||0;v+=(p.id===pp.me?oppBoost(p.id,r.id):(p.mom||0));
   v+=init?0:gauss()*.06;
   sc[p.id]=v;mx=Math.max(mx,v);
  });
  let z=0;PARTIES.forEach(p=>{sc[p.id]=Math.exp(sc[p.id]-mx);z+=sc[p.id];});
  PARTIES.forEach(p=>{r.sup[p.id]=init?sc[p.id]/z:.82*r.sup[p.id]+.18*sc[p.id]/z;});
  PARTIES.forEach(q=>{if(!q.parent||!r.sup[q.parent])return;const m=.4*r.sup[q.id];let o=0;PARTIES.forEach(x=>{if(x.id!==q.parent&&x.id!==q.id&&!x.parent)o+=r.sup[x.id];});
   if(o>0&&r.sup[q.parent]>m+.02){r.sup[q.parent]-=m;PARTIES.forEach(x=>{if(x.id!==q.parent&&x.id!==q.id&&!x.parent)r.sup[x.id]+=m*r.sup[x.id]/o;});}});
 });
}

function neiStep(){
 const ya=(G.year-1880)+(G.q-1)/4,L=G.pl;
 G.nei.forEach(n=>{
  const d=neiDef(n.id);

   const w=n.war;
   let our=ourPower();G.nei.forEach(a=>{if(a.ally&&a!==n&&!a.war)our+=a.pow*.4;});
   const their=n.pow*(.9+.2*rnd());
   w.prog=clamp(w.prog+(our*(.8+.4*rnd())-their)/Math.max(10,(our+their)/2)*18,-100,100);w.t++;
   G.treasury-=.008*G.gdp;G.pop*=1-.0005;G.stab-=.5;
   if(Math.abs(w.prog)>=100||w.t>=14)endWar(n);

  }
  const tgt=10-65*d.agg+[0,5,5,-25][L.dip]+(n.ally?30:0)+(n.pact>0?10:0)+15*n.trade-clamp((n.pow/Math.max(5,ourPower())-1)*8,0,20)*d.agg;

  if(n.ally&&n.rel<0){n.ally=false;news(`💔 ${d.name}との同盟が破棄された`,'bad');}

/* ===================== 選挙・不正 ===================== */
const CAMP_WIN=4;
const newCamp=()=>({pr:0,cash:0,harass:0,pork:{},block:{}});
const campOpen=()=>G.pol.elT-G.t<=CAMP_WIN&&!G.elect;
function addHeat(x){G.fraud.heat=Math.min(100,G.fraud.heat+x*[.6,1,1.25][G.pl.press]*(G.fx&&G.fx.fraudM||1));}
function allUnrest(d){G.reg.forEach(r=>{r.unrest=clamp(r.unrest+d,0,100);});}

function calcSeats(mods,noise){
 if(typeof isOpp==='function'&&isOpp())mods=false;
 const L=G.pl,pp=G.pol,fr=[.35,.7,1][L.suff],C=G.camp||newCamp();
 const mult={rodo:[.6,.9,1][L.suff],seiyu:[1.25,1.05,1][L.suff],minsei:1,kokusui:[.9,1,1][L.suff]};PARTIES.forEach(p=>{if(mult[p.id]==null)mult[p.id]=1;});
 const vote={};PARTIES.forEach(p=>vote[p.id]=0);
 G.reg.forEach(r=>{
  let w=regDef(r.id).popw*fr*(.7+.3*r.dev/100);
  const a={};PARTIES.forEach(p=>a[p.id]=r.sup[p.id]*mult[p.id]);
  if(mods){
   a[pp.ruling]*=1+.07*C.cash+.05*C.pr+.07*(C.pork[r.id]||0);
   PARTIES.forEach(p=>{if(p.id!==pp.ruling&&p.id!==pp.partner)a[p.id]*=1-.05*C.harass;});
   w*=1-.45*(C.block[r.id]||0);
  }
  let s=0;PARTIES.forEach(p=>s+=a[p.id]);
  PARTIES.forEach(p=>{vote[p.id]+=w*a[p.id]/s;});
 });
 for(let k=0;k<2;k++){
  let s=0;PARTIES.forEach(p=>s+=vote[p.id]);
  PARTIES.forEach(p=>{vote[p.id]=Math.max(.005,vote[p.id]/s*(k===0&&noise?(1+gauss()*noise):1));});
 }
 const seats={},rem=[];let used=0;
 PARTIES.forEach(p=>{const x=seatShare(p.id,vote)*300;seats[p.id]=Math.floor(x);used+=seats[p.id];rem.push([x-seats[p.id],p.id]);});
 rem.sort((a,b)=>b[0]-a[0]);
 for(let i=0;used<300;i++,used++)seats[rem[i%rem.length][1]]++;
 if(mods&&G.fraud.gerry>0){
  const opp=PARTIES.filter(p=>p.id!==pp.ruling).sort((a,b)=>seats[b.id]-seats[a.id])[0];
  const take=Math.max(0,Math.min(6*G.fraud.gerry,seats[opp.id]-5));seats[opp.id]-=take;seats[pp.ruling]+=take;
 }
 return {vote,seats};
}
function coalitionFor(seats){
 const pp=G.pol,rs=seats[pp.ruling];
 if(rs>150)return {ok:true,partner:null,need:0};
 const cs=PARTIES.filter(p=>p.id!==pp.ruling&&seats[p.id]<=rs&&(G.sat[p.id]||0)>=.5).sort((a,b)=>((b.id===pp.partner)-(a.id===pp.partner))||partySim(pp.ruling,b.id)-partySim(pp.ruling,a.id));
 let need=151-rs-Math.max(0,...PARTIES.filter(p=>p.id!==pp.ruling).map(p=>seats[p.id]<=rs?seats[p.id]:0));
 for(const p of cs){if(rs+seats[p.id]>150)return {ok:true,partner:p.id,need:0};}
 return {ok:false,partner:null,need:Math.max(1,need)};
}
function initGov(){const pp=G.pol,cf=coalitionFor(pp.seats);pp.partner=cf.partner;pp.minority=!cf.ok;}
function forecast(){const r=calcSeats(true,0),cf=coalitionFor(r.seats),pp=G.pol;
 return {seats:r.seats,vote:r.vote,ok:cf.ok,partner:cf.partner,total:r.seats[pp.ruling]+(cf.partner?r.seats[cf.partner]:0),need:cf.need};}

function startElection(){
 const pp=G.pol,r=calcSeats(true,.06),cf=coalitionFor(r.seats);
 G.elect={year:G.year,q:G.q,vote:r.vote,seats:r.seats,partner:cf.partner,lost:!cf.ok,need:cf.need,tampered:0,orig:null};
 G.big=true;
 news(`🗳️ 総選挙の開票が始まった${cf.ok?'':'。与党は過半数に届かない見込み！'}`,'info',true);
}
function finishElection(e){
 const pp=G.pol;
 pp.seats=e.seats;pp.vote=e.vote;pp.lastElect=G.t;pp.elT=G.t+12+4*(G.pl.term==null?1:G.pl.term);
 pp.hist.unshift({y:e.year,seats:Object.assign({},e.seats),ruling:pp.ruling,tamper:e.tampered});if(pp.hist.length>10)pp.hist.length=10;
 const cf=coalitionFor(e.seats);
 news(`🗳️ 総選挙：${PARTIES.map(p=>p.short+e.seats[p.id]).join(' ')}${e.tampered?'(開票に不審な点)':''}`,'info',true);
 if(!cf.ok){
  const top=PARTIES.slice().sort((a,b)=>e.seats[b.id]-e.seats[a.id])[0];
  G.over={kind:'下野(選挙敗北)',msg:`総選挙で与党は過半数を失い、${top.name}を中心とする新政権が発足した。あなたの内閣は総辞職し、瑞穂国の舵取りは野党の手に渡った。`};
  news('🏳️ 総選挙に敗れ、内閣は総辞職した','bad',true);
 }else{
  pp.partner=cf.partner;pp.minority=false;pp.approval=clamp(pp.approval+.03,.05,.9);
  if(cf.partner)news(`🤝 ${partyOf(pp.ruling).name}と${partyOf(cf.partner).name}の連立で政権を維持`,'conf');
 }
 G.camp=newCamp();G.elect=null;
}
function tamperInfo(lv){
 const e=G.elect,seatShift=[15,35,70][lv-1];
 const pf=clamp([.22,.45,.65][lv-1]+(G.pl.press===2?.1:G.pl.press===0?-.1:0)+G.fraud.heat*.002,.05,.92);
 const sim=Object.assign({},e.seats);let n=seatShift;
 while(n>0){const o=PARTIES.filter(p=>p.id!==G.pol.ruling).sort((a,b)=>sim[b.id]-sim[a.id])[0];if(sim[o.id]<=0)break;sim[o.id]--;sim[G.pol.ruling]++;n--;}
 return {shift:seatShift,fail:pf,enough:coalitionFor(sim).ok,sim};
}
function resolveElection(choice){
 const e=G.elect,pp=G.pol;if(!e)return err('開票中の選挙はありません');
 if(choice!=='accept'){
  if(!e.lost)return err('改ざんの必要はありません');
  const lv=Number(String(choice).slice(6))||1,ti=tamperInfo(lv);
  addHeat([20,35,50][lv-1]);
  if(rnd()<ti.fail){
   allUnrest(25);G.stab=clamp(G.stab-12,0,100);G.fraud.exposed++;
   fallFromPower('不正発覚・失脚','開票結果の改ざんが露見した。新聞は一斉に報じ、民衆は議会を取り囲み、内閣は総辞職に追い込まれた。');
   news('🕵️ 開票結果の改ざんが発覚！内閣は崩壊した','bad',true);G.elect=null;
   return ok('改ざんが発覚しました…');
  }
  e.orig=Object.assign({},e.seats);e.seats=ti.sim;e.tampered=lv;allUnrest(10);G.pol.scandal+=2;
  news('🤫 開票結果に不審な点があると噂されている','conf');
 }
 finishElection(e);
 return ok(G.over?'選挙に敗れました':'政権を維持しました');
}

 f.dem.trade=(f.dem.trade||1)*(1-.5*dd)*(C.reg===0?1.03:1);

 f.credit+=-1.2*(C.polRate-.04)-(C.reg===0&&C.res<0?.15:0);

function curStep(){
 const C=G.cur,s=scl2(),f=G.fx;
 const dd=(C.ex-100)/100,war=G.nei.some(n=>n.war)?1:0;
 const tn=clamp(.3*(G.tech-G.wt)/30+1.0*((f.dem.trade||1)-1)-1.2*dd-.3*war-.25*Math.max(0,G.cycle)+.1*G.sent+gauss()*.2,-1,1);
 C.tb=tn*.012*G.gdp;C.tbH.push(C.tb);if(C.tbH.length>80)C.tbH.shift();
 const prq=C.pr/Math.max(1,G.gdp);C.pr=0;const flow=C.flow||0;C.flow=0;
 const rd=C.polRate-.04-.012*G.cycle;
 let lnd=0;const free=C.reg===2?1:C.reg===1?.45:0;
 if(free>0){lnd=free*(.04*tn+.1*flow/Math.max(1,G.gdp)+.25*rd-.3*(C.infl-.02)/4+.01*G.sent-.015*war+gauss()*.012);C.ex*=Math.exp(lnd);}
 else if(C.reg===3){C.ex=C.peg;}else C.ex=100;
 if(C.reg===0||C.reg===3)C.res+=C.tb;else if(C.reg===1)C.res+=.3*C.tb;
 C.ex=clamp(C.ex,35,260);
 // 通貨危機
 if((C.reg===0||C.reg===3)&&C.res<-150*s){
  C.crisis++;C.reg=2;C.ex*=.72;C.res=20*s;C.infl+=.06;G.stab=clamp(G.stab-7,0,100);G.sent=clamp(G.sent-.5,-1,1);G.cs-=.25;G.pol.approval=clamp(G.pol.approval-.05,.05,.9);
  lnd=Math.log(.72);
  news('💱 準備が尽き固定相場を維持できず通貨が暴落(通貨危機)。変動相場制へ移行','bad',true);
 }else if(C.reg===1&&C.res<-400*s){
  C.crisis++;C.reg=2;C.ex*=.85;C.res=20*s;G.stab=clamp(G.stab-3,0,100);G.sent=clamp(G.sent-.25,-1,1);lnd=Math.log(.85);
  news('💱 外貨が枯渇し通貨が急落。管理通貨制は維持できず変動相場制へ','bad',true);
 }
 // 物価
 let tgt;
 if(C.reg===0){tgt=.006+.015*G.cycle-(C.res<100*s?.012:0);}
 else tgt=.012+(C.reg===0?0:prq*4*1.6)-.25*lnd*4+.02*G.cycle+(.04-C.polRate)*.5;
 C.infl=clamp(.7*C.infl+.3*tgt,-.08,1.5);
 if(C.infl>.6){C.infl=.2;C.ex*=.6;C.crisis++;G.stab=clamp(G.stab-10,0,100);G.pol.approval=clamp(G.pol.approval-.1,.05,.9);news('🔥 ハイパーインフレ。通貨が信認を失い、国民生活は崩壊の危機に','bad',true);}
 C.cpi*=1+C.infl/4;
 C.stabPen=60*Math.max(0,C.infl-.05)+40*Math.max(0,-.015-C.infl);
 if(C.infl<-.015){G.unemp=clamp(G.unemp+.004,0,.6);G.cs-=.03;}
 C.ex=clamp(C.ex,35,260);
 for(const k in C.fr){const n=neiOf(k);C.fr[k].v*=Math.exp(gauss()*.012+(n&&n.war?-.02:0));C.fr[k].v=clamp(C.fr[k].v,40,250);}
 C.exH.push(C.ex);C.cpiH.push(C.cpi);if(C.exH.length>160){C.exH.shift();C.cpiH.shift();}
}

 if(dir>0){if(C.res<a)return err('介入に使う準備が足りません');C.res-=a;C.ex*=1.04;return ok('自国通貨を買い支えました(+4%)');}
 C.res+=a;C.ex*=.96;C.pr+=a*.5;return ok('自国通貨を売り、外貨を積み増しました(-4%)');}

function mstat(c){
 const eq=Math.max(1,c.K+c.cash-c.debt),mc=c.price*c.S/1e4,eps=4*c.earn*1e4/c.S,dvs=(c.dvh||[]).reduce((a,b)=>a+b,0)*1e4/c.S;
 const ph=c.ph.slice(-4);
 return {eq,mc,eps,per:eps>0?c.price/eps:null,pbr:mc/eq,dps:dvs,yld:dvs/Math.max(1,c.price),roe:4*c.earn/eq,hi:Math.max(...ph,c.price),lo:Math.min(...ph,c.price),eqr:eq/Math.max(1,c.K+c.cash)};}
function mktStat(){
 const ls=G.companies.filter(c=>c.alive&&c.listed);let mc=0,earn=0,eq=0,dv=0,up=0,dn=0;
 for(const c of ls){const m=c.price*c.S/1e4;mc+=m;if(c.earn>0)earn+=4*c.earn;eq+=Math.max(1,c.K+c.cash-c.debt);dv+=(c.dvh||[]).reduce((a,b)=>a+b,0);if(c.chg>0)up++;else if(c.chg<0)dn++;}
 let pmc=0;for(const c of ls)if(c.earn>0)pmc+=c.price*c.S/1e4;
 return {n:ls.length,mc,per:earn>0?pmc/earn:null,pbr:eq>0?mc/eq:null,yld:mc>0?dv/mc:0,buf:mc/Math.max(1,G.gdp*4),up,dn};}
function bumpMul(c){const b=c.bump;if(!b)return 1;const age=G.t-b.t;if(age>=b.len){c.bump=null;return 1;}return 1+(b.m-1)*(1-age/b.len);}

function insInit(){G.priv={cash:600*scl2(),real:0,cb:{},buyT:{},tag:{},fr:0,fees:0,tax:0};G.ins={heat:0,probe:null,scandals:0,tips:[],tid:1,gain:0};G.payPriv=false;}
function privValue(){let v=G.priv.cash+fValue('priv');for(const c of G.companies)if(c.alive&&c.hold.priv)v+=c.hold.priv*c.price/1e4;return v;}
function pressF(){return [.5,1,1.5][G.pl.press]*(G.media?mediaScrut():1)*(G.fx&&G.fx.insM||1);}
const TIPK=[
 {k:'order',up:.34,w:3,t:c=>`政府が${c.name}への大型発注を内定。発表は近日`},
 {k:'subsidy',up:.22,w:2,t:c=>`政府が${c.name}への補助金交付を検討中`},
 {k:'earn+',up:.28,w:3,t:c=>`${c.name}の次期決算は大幅増益の見通し`},
 {k:'earn-',up:-.28,w:3,t:c=>`${c.name}の次期決算は大幅減益の見通し`},
 {k:'probe',up:-.36,w:1.5,t:c=>`検察が${c.name}の不正会計の捜査に着手する方針`},
 {k:'takeover',up:.45,w:1.5,t:c=>{const z=ctrlZ(c);return `ある財閥が${c.name}の買収に動いている`;}},
 {k:'bankrupt',up:-.6,w:0,t:c=>`${c.name}は資金繰りが限界。破綻の恐れ`},
 {k:'sec+',up:.12,w:1.5,sec:1,t:(c,s)=>`政府は来期、${SECT[s].n}業界の保護・振興策を決定する見込み`},
 {k:'sec-',up:-.12,w:1.5,sec:1,t:(c,s)=>`政府は来期、${SECT[s].n}業界への課税・規制強化を決定する見込み`}];
const CONF={A:{p:.88,n:'確度高',w:.25},B:{p:.7,n:'有力',w:.45},C:{p:.5,n:'噂レベル',w:.3}};
function genTips(){
 const I=G.ins;I.tips=I.tips.filter(t=>t.tEv>=G.t-1);
 if(I.tips.filter(t=>t.tEv>=G.t).length>=4)return;
 const n=(rnd()<.55?1:0)+(rnd()<.2?1:0);
 const ls=G.companies.filter(c=>c.alive&&c.listed&&c.price>0);if(ls.length<3)return;
 for(let i=0;i<n;i++){
  const c=pick(ls);if(I.tips.some(t=>t.cid===c.id&&t.tEv>=G.t))continue;
  const weak=c.profit<0&&c.debt>c.K*.5;
  let ks=TIPK.map(k=>({k,w:k.k==='bankrupt'?(weak?5:0):k.k==='earn-'?k.w*(c.profit<0?2:.7):k.k==='earn+'?k.w*(c.profit>0?1.6:.4):k.w}));
  let tw=ks.reduce((a,x)=>a+x.w,0),r=rnd()*tw,K=ks[0].k;for(const x of ks){r-=x.w;if(r<=0){K=x.k;break;}}
  let rc=rnd(),cf='C';if(rc<CONF.A.w)cf='A';else if(rc<CONF.A.w+CONF.B.w)cf='B';
  const real=rnd()<CONF[cf].p,trap=!real&&rnd()<.45,sec=K.sec?c.sector:null;
  I.tips.push({id:I.tid++,cid:c.id,sec,kind:K.k,up:K.up,txt:K.t(c,sec),conf:cf,real,trap,tEv:G.t+1+Math.floor(rnd()*3),t0:G.t,done:false});
 }
}
function addBump(c,up,len){const cur=bumpMul(c)-1;c.bump={m:1+cur+up,t:G.t,len:len||8};}
function applyTip(t){
 const targets=t.sec?G.companies.filter(c=>c.alive&&c.listed&&c.sector===t.sec):[co(t.cid)].filter(c=>c&&c.alive);
 if(!targets.length)return;
 const eff=t.real?t.up:t.trap?-.5*t.up:0;if(!eff)return;
 for(const c of targets){
  addBump(c,eff,8);
  if(t.real&&!t.sec){
   if(t.kind==='bankrupt'){c.cash-=.6*c.K;c.lossQ=Math.max(c.lossQ,3);}
   else if(t.kind==='subsidy'||t.kind==='order'||t.kind==='earn+')c.cash+=.04*c.K;
   else if(t.kind==='earn-')c.cash-=.03*c.K;
  }
 }
 const c0=targets[0],pos=eff>0;
 if(t.sec)news(`📰 政府が${SECT[t.sec].n}業界への${pos?'振興策':'規制強化'}を発表。業界株が${pos?'上昇':'下落'}`,'info');
 else if(t.real||t.trap)news(`📰 ${c0.name}${t.kind==='probe'?'に不正会計の疑い。捜査が始まった':t.kind==='bankrupt'?'の経営危機が表面化':t.kind==='takeover'?'に買収の観測。株価が反応':t.kind==='order'?'が政府から大型受注':t.kind==='subsidy'?'に政府が補助金':pos?'が好決算を発表':'が減益を発表'}`,pos?'good':'bad');
}
function stAct(cid){
 if(!G.priv)return;const c=co(cid);if(!c||!c.hold.priv)return;
 if((G.priv.buyT[c.id]||-99)>=G.t-4){const s=scl2(),v=c.hold.priv*c.price/1e4;G.ins.heat=Math.min(100,G.ins.heat+(6+Math.min(14,v/(20*s)))*pressF());G.priv.fr++;}
}
function insHeat(x){G.ins.heat=Math.min(100,G.ins.heat+x*pressF());}
function pInsBuy(cid,frac){
 const c=co(cid),P=G.priv,s=scl2();if(!c||!c.alive)return err('会社が存在しません');if(!c.listed)return err('未上場です');
 if(G.elect)return err('開票中です');
 const cap=Math.floor(c.S*.15)-(c.hold.priv||0);if(cap<=0)return err('大量保有の上限(15%)に達しています');
 const q=quote(c,Math.min(Math.floor(c.S*frac),cap),1);if(!q.n)return err('市場に売り株がありません');
 const fee=.003*q.amt;if(q.amt+fee>P.cash)return err('私財が足りません');
 P.cash-=q.amt+fee;P.fees+=fee;exec(c,'priv',q.n,1);P.cb[cid]=(P.cb[cid]||0)+q.amt+fee;P.buyT[cid]=G.t;
 const tip=G.ins.tips.find(t=>!t.done&&(t.cid===cid||(t.sec&&t.sec===c.sector)));
 if(tip){P.tag[cid]=tip.id;insHeat(2+Math.min(10,q.amt/(30*s)));}else insHeat(.4);
 return ok(`${c.name}株${(q.n/c.S*100).toFixed(1)}%を${fm(q.amt)}で買いました`);}
function pInsSell(cid,frac){
 const c=co(cid),P=G.priv,s=scl2();if(!c||!c.alive)return err('会社が存在しません');const h=c.hold.priv||0;if(h<=0)return err('保有していません');
 const n=Math.max(1,Math.floor(h*frac)),q=quote(c,n,-1),fee=.003*q.amt,basis=(P.cb[cid]||0)*n/h;
 exec(c,'priv',n,-1);P.cash+=q.amt-fee;P.fees+=fee;P.cb[cid]=Math.max(0,(P.cb[cid]||0)-basis);if(!c.hold.priv){delete P.cb[cid];}
 const gain=q.amt-fee-basis;let msg=`${c.name}株を${fm(q.amt)}で売却(損益${gain>=0?'+':''}${fm(gain)})`;
 if(gain>0){const tax=.2*gain;P.cash-=tax;P.tax+=tax;G.treasury+=tax;G.ins.gain+=gain;
  const tagged=P.tag[cid]!=null;insHeat(Math.min(25,Math.max(1,gain/(10*s)))*(tagged?1.3:.3));}
 else G.ins.gain+=gain;
 if(!c.hold.priv)delete P.tag[cid];
 return ok(msg);}

 for(const s in f.mg)f.mg[s]*=X.wm;
 for(const s in f.dem)if(s!=='trade')f.dem[s]*=X.dm;
 f.credit=(f.credit||0)+X.cr;f.rate=(f.rate||0)+X.rp;
}
function pBond(frac,who){const X=G.mac;if(!X)return err('不可');if(X.ratio>2.2)return err('債務が大きすぎ、市場が国債を消化できません');
 const a=frac*G.gdp,fo=who==='foreign';G.treasury+=a;X.debt+=a;if(fo)X.fdebt=(X.fdebt||0)+a;
 return ok(`${fo?'外債(海外の投資家が引受)':'国債(国内で消化)'}を${fm(a)}発行しました(利回り${(X.yld*100).toFixed(1)}%)`);}
function pRepay(frac){const X=G.mac;if(!X||X.debt<=0)return err('発行済みの国債がありません');
 const a=Math.min(X.debt,frac*G.gdp);if(G.treasury<a)return err('国庫が足りません');G.treasury-=a;const fr=X.debt>0?(X.fdebt||0)/X.debt:0;X.debt-=a;X.fdebt=Math.max(0,(X.fdebt||0)-a*fr);return ok(`国債を${fm(a)}償還しました`);}
function pLoan(cid,amt){const c=co(cid);if(!c||!c.alive)return err('会社が存在しません');if(G.treasury<amt)return err('国庫が足りません(先に国債を発行できます)');
 const lim=.8*c.K-(c.gl||0);if(amt>lim)return err(`融資の上限(資本の80%)を超えます。残り枠${fm(Math.max(0,lim))}`);
 G.treasury-=amt;c.cash+=amt;c.debt+=amt;c.gl=(c.gl||0)+amt;c.rep=clamp(c.rep+.02,-1,1);return ok(`${c.name}に${fm(amt)}を政府融資しました(利率${(Math.max(.004,G.rate-.004)*400).toFixed(1)}%・年)`);}
function pLoanCall(cid){const c=co(cid);if(!c||!c.alive||!(c.gl>0))return err('融資がありません');
 const a=Math.min(c.gl,Math.max(0,c.cash-.05*c.K));if(a<=0)return err('相手に返済余力がありません');c.cash-=a;c.debt=Math.max(0,c.debt-a);G.treasury+=a;c.gl-=a;if(c.cash<.1*c.K)c.rep=clamp(c.rep-.05,-1,1);return ok(`${fm(a)}を回収しました`);}
function pWageGuide(dir){const X=G.mac;if(!X)return err('不可');if(G.t<X.wcd)return err('賃金ガイドラインは4四半期に1回です');if(G.pol.pc<3)return err('政治資本が足りません(必要3)');
 G.pol.pc-=3;X.wcd=G.t+4;
 if(dir>0){X.w*=1.03;G.sent=clamp(G.sent+.02,-1,1);return ok('官民に賃上げを要請しました(賃金+3%・企業利益は圧迫)');}
 X.w*=.97;allUnrest(1.5);return ok('賃金抑制を要請しました(賃金-3%・不満が増す)');}
function macVoices(){const X=G.mac,t=[];
 if(G.unemp>X.nat+.03)t.push('景気が冷え込み、求人が減っている。失業者が増えた');

const CORE_BOOST={rail:1.8,telecom:1.7,power:1.2,bank:1.2,trade:1.3,steel:1.1,press:1.1,retail:1.1};
function gk(p){return 'g'+p.id;}
function grpPfx(c){const sf=SECT[c.sector].suf;for(const s of sf)if(c.name.endsWith(s))return c.name.slice(0,-s.length);return c.name.slice(0,2);}
function grpOf(c){const k=ctrlKey(c);if(k&&k[0]==='g'){const p=co(+k.slice(1));return p&&p.alive?p:null;}return null;}
function grpMembers(p){return G.companies.filter(c=>c.alive&&c.hold&&(c.hold[gk(p)]||0)>=c.S*.5);}
function grpName(p){return grpPfx(p)+'グループ';}
function grpList(){return G.companies.filter(c=>c.alive&&grpMembers(c).length>0);}
function stateRescue(c){
 const need=Math.max(0,-c.cash)+.1*c.K;G.treasury-=need;c.cash+=need;c.debt=Math.min(c.debt,c.K*.6);c.lossQ=0;if(c.K<80)c.K=80;
 if(!c.rescT||G.t-c.rescT>=8){c.rescT=G.t;news(`🏛️ 官営の${c.name}が経営危機に陥ったが、政府が${fm(need)}を投じて救済した(官営は倒産しない)`,'conf');}}
function stateRename(){
 for(const c of G.companies){if(!c.alive||!/^(官営|国営)/.test(c.name)||ctrlKey(c)==='state')continue;
  const k=ctrlKey(c);let pf=null;
  if(k&&k[0]==='z'){const z=zOf(k);if(z)pf=z.name;}else if(k&&k[0]==='g'){const p=co(+k.slice(1));if(p&&p.alive)pf=grpPfx(p);}
  if(!pf)pf=pick(FN);
  const old=c.name;c.name=mkName(pf,c.sector);news(`🏯 ${old}が国の手を離れ、${c.name}と改称した`,'info');}}
function grpStep(){
 stateRename();
 const sc=Math.max(1,G.gdp/6000),al=G.companies.filter(c=>c.alive);
 // 基幹産業(鉄道・通信など)が未成立なら、有力な実業家が起業する
 for(const sec of ['rail','telecom','power']){if(!unlocked(sec)||al.some(c=>c.sector===sec))continue;
  if(rnd()<.14){const K=Math.round(sectorK(sec,1)*(1+.4*rnd()));const c=mkCo(sec,null,K);news(`🚆 ${c.name}が設立された(${SECT[sec].n})`,'info',true);}}
 // 親会社の消滅:子会社は市場に放出される
 for(const c of al){for(const k in c.hold){if(k[0]==='g'){const p=co(+k.slice(1));if(!p||!p.alive){c.hold.pub=(c.hold.pub||0)+c.hold[k];delete c.hold[k];}}}}
 for(const p of al){
  if(!p.alive||ctrlKey(p)==='state')continue;
  const subs=grpMembers(p),zp=ctrlZ(p);
  // グループ内シナジー
  for(const s of subs){s.q=clamp(s.q+.004,0,1);s.rep=clamp(s.rep+.01,-1,1);if(s.rev>0)p.cash+=.003*s.rev*(p.sector==='rail'?2:1);
   // 子会社の上場
   if(!s.listed&&s.K>=800*sc&&s.profit>0&&rnd()<.07){s.listed=true;const n=Math.floor(s.S*.3),q=quote(s,n,-1);p.cash+=q.amt*.95;exec(s,gk(p),n,-1);
    news(`📈 ${grpName(p)}の${s.name}が株式を上場`,'info');}}
  const boost=CORE_BOOST[p.sector]||1,core=boost>=1.7;
  if(p.K<(core?380:700)*sc||p.profit<=0)continue;
  // 多角化:本業の周辺に新会社を設立
  if(subs.length<(CORE_BOOST[p.sector]>=1.7?7:4)&&rnd()<(core?.2:.1*boost)){
   const rel=RELATED[p.sector]||[];let best=null,bs=-9;
   for(const s of rel){if(!unlocked(s))continue;const x=G.sec[s];if(!x)continue;
    const sc2=x.mg*3+(x.unmet>x.D*.05?1:0)+(x.u>.85?.5:0)+rnd()*.5+(x.n===0?.6:0)-(subs.some(q=>q.sector===s)?.6:0)-(x.n>=6?1:0)-(x.u<.6&&x.n>0?1:0);
    if(sc2>bs){bs=sc2;best=s;}}
   if(best&&bs>1.0){
    const K=Math.round(sectorK(best,1)*(.6+.4*rnd())*Math.min(1.6,.8+.4*boost));
    if(p.cash-.1*p.K>=(core?.25:.55)*K&&p.debt<p.K*(core?.85:.6)){
     const pc=core?.25:.55;p.cash-=pc*K;p.debt+=(1-pc)*K;
     const c=mkCo(best,null,K,false,rnd()<.6?p.reg:null);
     c.name=mkName(grpPfx(p),best);c.hold={[zp?zp.key:gk(p)]:c.S};
     const why=p.sector==='rail'?'沿線開発の一環として':p.sector==='telecom'?'通信網を生かして':'事業の多角化のため';
     news(`🏭 ${p.name}が${why}${c.name}を設立${zp?'':`(${grpName(p)})`}`,'info',K>1200);continue;}}}
  // M&A:周辺・同業の中小企業を傘下に
  if(!zp&&p.K>=1100*sc&&p.cash-.15*p.K>250*sc&&rnd()<.07*boost){
   const rel=RELATED[p.sector]||[];
   const cand=al.filter(t=>t!==p&&t.alive&&t.sector!=='bank'||(t!==p&&t.alive&&t.sector==='bank'&&p.sector==='bank')).filter(t=>t.K<p.K*.6&&!grpOf(t)&&!grpMembers(t).length&&(ctrlKey(t)===null||ctrlKey(t)==='pub')&&(t.sector===p.sector||rel.includes(t.sector)));
   if(cand.length){
    cand.sort((a,b)=>(b.earn/b.K-a.earn/a.K)+(b.lossQ>=3?.04:0)*(-1)+(rnd()-.5)*.02);const t=cand[0];
    if(t.listed&&(t.hold.pub||0)>t.S*.06){
     const n=Math.min(t.hold.pub,.2*t.S),q=quote(t,n,1);
     if(q.n&&p.cash-.15*p.K>=q.amt*1.05){const before=t.hold[gk(p)]||0;p.cash-=q.amt;exec(t,gk(p),q.n,1);const after=t.hold[gk(p)]||0;
      if(before<t.S*.5&&after>=t.S*.5)news(`🤝 ${p.name}が${t.name}を買収し子会社化(${grpName(p)})`,'conf',t.K>1500);
      else if(before<t.S*.2&&after>=t.S*.2)news(`💼 ${p.name}が${t.name}の株を買い進める`,'info');}}
    else if(!t.listed&&t.K<p.K*.4){
     const cost=fairMC(t)*1.2;
     if(p.cash-.15*p.K>=cost){p.cash-=cost;t.cash+=0;t.hold={[gk(p)]:t.S};news(`🤝 ${p.name}が未上場の${t.name}を傘下に収めた(${grpName(p)})`,'conf');}}
   }}
 }
}

const isOpp=()=>!!(typeof G!=='undefined'&&G&&G.pol&&G.pol.me&&G.pol.me!==G.pol.ruling);
const meId=()=>G.pol.me||G.pol.ruling;
const meParty=()=>partyOf(meId());
/* ---- 連立(任意の党を首班として) ---- */
function coalitionFor(seats,lead,excl){
 const pp=G.pol;lead=lead||pp.ruling;const rs=seats[lead]||0,me=meId();
 if(rs>150)return {ok:true,partner:null,need:0};
 const inc=lead===pp.ruling&&lead===me;
 const willing=p=>{
  if(p.id===lead||p.id===excl)return false;
  if(seats[p.id]>rs)return false;
  if(lead!==me&&p.id===me)return false;
  if(inc)return (G.sat[p.id]||0)>=.5;
  if(lead===pp.ruling)return (G.sat[p.id]||0)>=.5||partySim(lead,p.id)>=.6;
  if(lead===me&&pp.pact===p.id)return true;
  return partySim(lead,p.id)>=(lead===me?.66:.6);
 };
 const all=PARTIES.filter(p=>p.id!==lead&&p.id!==excl&&seats[p.id]<=rs&&!(lead!==me&&p.id===me));
 const cs=all.filter(willing).sort((a,b)=>((b.id===pp.partner)-(a.id===pp.partner))||((b.id===pp.pact)-(a.id===pp.pact))||partySim(lead,b.id)-partySim(lead,a.id));
 const need=151-rs-Math.max(0,...all.map(p=>seats[p.id]));
 for(const p of cs){if(rs+seats[p.id]>150)return {ok:true,partner:p.id,need:0};}
 return {ok:false,partner:null,need:Math.max(1,need)};
}
/* 選挙後の組閣:現与党が過半数を組めれば続投、無理なら議席の多い党から順に試す */
function formGov(seats,excl){
 const pp=G.pol,ids=PARTIES.map(p=>p.id).filter(i=>i!==excl);
 const order=(ids.includes(pp.ruling)?[pp.ruling]:[]).concat(ids.filter(i=>i!==pp.ruling).sort((a,b)=>seats[b]-seats[a]));
 for(const id of order){const cf=coalitionFor(seats,id,excl);if(cf.ok)return {lead:id,partner:cf.partner,ok:true,need:0};}
 const top=ids.slice().sort((a,b)=>seats[b]-seats[a]);
 const lead=(ids.includes(pp.ruling)&&seats[pp.ruling]>=seats[top[0]]-8)?pp.ruling:top[0];
 return {lead,partner:null,ok:false,need:coalitionFor(seats,lead,excl).need};
}
/* 自党が首班になるとしたときの勢力(野党の目標表示用) */
function meBloc(seats){
 const pp=G.pol,me=meId(),cf=coalitionFor(seats,me);
 const pc=pp.pact&&partyOf(pp.pact)&&pp.pact!==me?pp.pact:null;
 const partner=cf.partner||pc;
 const total=(seats[me]||0)+(partner?(seats[partner]||0):0);
 return {me,partner,total,ok:cf.ok,need:Math.max(0,151-total)};
}

 }

function tamperInfo(lv){

}

 G.xp.push(p);PARTIES.push(p);if(typeof PCOL!=='undefined')PCOL.own=p.col;return p;}

/* ===================== 国民モード(投資家):日次の値動き・板・口座・注文 ===================== */
const NB=33,SUB=3,NS=NB*SUB;      // 1日=33本の10分足(前場15本+後場18本)。1本=3サンプル
const LOT=10,TAXR=.20315;
const HOLI=['1-1','1-2','1-3','2-11','4-29','5-3','5-4','5-5','11-3','11-23','12-31'];
const WD='日月火水木金土';
/* ---- 決定論の乱数(同じ日・同じ銘柄なら同じ値動きを再現) ---- */
function hsh(a,b,c){let h=2166136261>>>0;for(const x of [a,b,c]){h^=((x|0)+0x9e3779b9)>>>0;h=Math.imul(h,16777619)>>>0;h^=h>>>13;}return h>>>0;}
function mulb(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function gaussR(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
/* ---- 暦 ---- */
const dtOf=dn=>new Date(Date.UTC(1880,0,1+dn));
function isTD(dn){const d=dtOf(dn),wd=d.getUTCDay();if(wd===0||wd===6)return false;return !HOLI.includes((d.getUTCMonth()+1)+'-'+d.getUTCDate());}
function nextTD(dn){do{dn++;}while(!isTD(dn));return dn;}
function qOf(dn){const d=dtOf(dn);return (d.getUTCFullYear()-1880)*4+Math.floor(d.getUTCMonth()/3);}
function dInfo(dn){const d=dtOf(dn);return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),wd:d.getUTCDay()};}
function dLabel(dn){const x=dInfo(dn);return `${x.y}/${String(x.m).padStart(2,'0')}/${String(x.d).padStart(2,'0')}(${WD[x.wd]})`;}
function tLabel(k){if(k<=0)return '9:00';const m=k<=15?540+10*k:750+10*(k-15)+30-30;const mm=k<=15?540+10*k:(12*60+30)+10*(k-15);const h=Math.floor(mm/60),n=mm%60;return `${h}:${String(n).padStart(2,'0')}`;}
function mktState(){const C=G.cit;if(C.k<=0)return '寄り前';if(C.k>=NB)return '引け';if(C.k===15)return '前引け(昼休み)';return C.k<15?'前場':'後場';}
/* ---- 呼値・丸め ---- */
function tick(p){return p<=3000?1:p<=5000?5:p<=30000?10:p<=50000?50:p<=300000?100:p<=500000?500:p<=3e6?1000:p<=5e6?5000:p<=3e7?1e4:p<=5e7?5e4:p<=3e8?1e5:p<=5e8?5e5:1e6;}
function tkr(p){const t=tick(p);return Math.max(t,Math.round(p/t)*t);}
/* 3000円以下で1円刻みだと安い株は粗い。1000円未満は0.1円刻み */
function tickX(p){return p<1000?.1:tick(p);}
function rt(p){const t=tickX(p);return Math.max(t,Math.round(p/t)*t);}
const RT={q:{},d:{},snap:null,snapK:-1,bk:{}};
const PROF=(()=>{const a=[];let s=0;for(let k=1;k<=NB;k++){const x=k<=15?(k-1)/14:(k-16)/17;const w=.55+1.5*Math.pow(1-x,2.5)*(k<=15?1:.45)+(k<=15?0:1.1*Math.pow(x,3));a.push(w);s+=w;}const c=[0];let t=0;for(const w of a){t+=w/s;c.push(t);}return c;})();
const SECNOTE={mining:1.2,oil:1.25,air:1.15,game:1.2,soft:1.15,film:1.1,music:1.1};
/* ---- 銘柄・出来高・ボラティリティ ---- */
function isT(c){const C=G.cit;return !!(c&&c.listed&&c.tq!=null&&c.tq<=C.qi&&(c.alive||c.dlq===C.qi));}
function tradables(){const C=G.cit;if(RT.tl&&RT.tlq===C.qi&&RT.tlt===G.t&&RT.tlg===G)return RT.tl;RT.tl=G.companies.filter(isT);RT.tlq=C.qi;RT.tlt=G.t;RT.tlg=G;return RT.tl;}
function volOf(c){const lev=c.lev==null?.5:c.lev;let v=.008+.014*lev+(c.K<400?.006:0);if(G.sent<-.3)v*=1+.8*(-G.sent-.3);v*=SECNOTE[c.sector]||1;return clamp(v,.007,.05);}
function annDay(c){const C=G.cit,r=mulb(hsh(C.seed,c.id,C.qi*17+5));const u=r();return clamp(Math.round(C.nq*(.45+.4*u)),6,Math.max(7,C.nq-4));}
function qpath(c){
 const C=G.cit,key=c.id+':'+C.qi;let q=RT.q[key];if(q)return q;
 const n=C.nq,r=mulb(hsh(C.seed,c.id,C.qi*13+1)),sig=volOf(c),ann=annDay(c);
 const lr=Math.log(Math.max(.5,c.q1)/Math.max(.5,c.q0));
 const W=new Float64Array(n+1);for(let i=1;i<=n;i++)W[i]=W[i-1]+gaussR(r)*sig;
 const cl=new Float64Array(n+1);cl[0]=c.q0;
 for(let i=1;i<=n;i++){const f=i<ann?.22*i/ann:i===ann?.6:.6+.4*(i-ann)/Math.max(1,n-ann);
  cl[i]=Math.exp(Math.log(c.q0)+lr*f+(W[i]-i/n*W[n]));}
 cl[n]=Math.max(.5,c.q1);
 q={cl,ann};RT.q[key]=q;return q;}
function dayData(c){
 const C=G.cit;let d=RT.d[c.id];if(d)return d;
 const qp=qpath(c),i=C.dq+1,prev=qp.cl[i-1],close=qp.cl[i];
 const r=mulb(hsh(C.seed,c.id,C.qi*997+C.dq*7+3)),sig=volOf(c);
 const isAnn=i===qp.ann;
 const gap=(isAnn?Math.log(close/prev)*.85:0)+gaussR(r)*sig*.25;
 const open=prev*Math.exp(clamp(gap,-.35,.35));
 const p=new Float64Array(NS+1),w=new Float64Array(NS+1),s=sig*1.5/Math.sqrt(NS);
 for(let j=1;j<=NS;j++)w[j]=w[j-1]+gaussR(r)*s;
 const lr=Math.log(close/open);
 for(let j=0;j<=NS;j++)p[j]=open*Math.exp(lr*j/NS+(w[j]-j/NS*w[NS]));
 p[0]=open;p[NS]=close;
 const ff=clamp((c.hold&&c.hold.pub!=null?c.hold.pub:c.S*.5)/c.S,.1,1);
 const ret=Math.abs(Math.log(close/prev));
 const vol=Math.max(LOT,Math.round(c.S*ff*.018*Math.exp(.35*gaussR(r))*(1+(isAnn?2.2:0)+ret/Math.max(sig,.005)*.5)/LOT)*LOT);
 d={p,prev,open,close,vol,ann:isAnn};RT.d[c.id]=d;return d;}
/* ---- 現在値・日中の統計 ---- */
function cpx(c){const C=G.cit,d=dayData(c);const base=C.k<=0?d.prev:d.p[C.k*SUB];return rt(base*(1+(C.imp[c.id]||0)));}
function dstat(c){const C=G.cit,d=dayData(c),k=C.k;
 if(k<=0)return {px:d.prev,prev:d.prev,o:null,h:null,l:null,v:0,tv:0,chg:0,pct:0};
 let h=-1,l=1e18;const m=k*SUB;for(let j=0;j<=m;j++){const x=d.p[j];if(x>h)h=x;if(x<l)l=x;}
 const px=cpx(c),v=Math.round(d.vol*PROF[k]/LOT)*LOT;
 return {px,prev:rt(d.prev),o:rt(d.open),h:rt(Math.max(h,px)),l:rt(Math.min(l,px)),v,tv:v*px,chg:px-rt(d.prev),pct:px/rt(d.prev)-1};}
/* ---- 気配板 ---- */
function genBook(c,mid,seedx){
 const C=G.cit,d=dayData(c),tk=tickX(mid),r=mulb(hsh(C.seed^seedx,c.id,C.D*64+C.k));
 const sp=r()<.3?2:1,bid1=Math.floor(mid/tk+1e-9)*tk,ask1=bid1+sp*tk;
 const base=Math.max(LOT,d.vol*.05);
 const mk=(p0,dir)=>{const a=[];let p=p0;for(let j=0;j<60;j++){const q=Math.max(LOT,Math.round(base*(.35+1.3*r())*(1+.09*j)/LOT)*LOT);a.push({p:Math.round(p*100)/100,q});p=dir>0?p+tickX(p):Math.max(.1,p-tickX(p-.001));}return a;};
 return {asks:mk(ask1,1),bids:mk(bid1,-1),tk};}
function orderBook(c){const C=G.cit,key=c.id;let b=RT.bk[key];if(b&&b.D===C.D&&b.k===C.k)return b;
 const base=C.k<=0?dayData(c).prev:dayData(c).p[C.k*SUB];
 b=genBook(c,base*(1+(C.imp[c.id]||0)),11);b.D=C.D;b.k=C.k;b.au=[];b.bu=[];RT.bk[key]=b;return b;}
function bookView(c){const b=orderBook(c),f=(a,u)=>a.slice(0,10).map((x,i)=>({p:x.p,q:Math.max(0,x.q-(u[i]||0))}));return {asks:f(b.asks,b.au),bids:f(b.bids,b.bu),tk:b.tk};}
/* 成行:板を食いながら約定。戻り {n,avg,last} */
function walk(c,side,qty,limit){const b=orderBook(c);const lv=side>0?b.asks:b.bids,us=side>0?b.au:b.bu;let n=0,amt=0,last=null;
 for(let j=0;j<lv.length&&n<qty;j++){const x=lv[j];if(limit!=null&&(side>0?x.p>limit:x.p<limit))break;
  const av=x.q-(us[j]||0);if(av<=0)continue;const t=Math.min(av,qty-n);n+=t;amt+=t*x.p;last=x.p;us[j]=(us[j]||0)+t;}
 return {n,avg:n?amt/n:0,last};}
/* ---- 口座まわり ---- */
const posOf=cid=>{const C=G.cit;return C.pos[cid]||(C.pos[cid]={t:{n:0,cost:0},n:{n:0,cost:0}});};
function pxOf(cid){const c=co(cid);return c&&isT(c)?cpx(c):0;}
function mgUnreal(){const C=G.cit;let u=0;for(const k in C.mg){const m=C.mg[k];u+=m.side*(pxOf(+k)-m.avg)*m.n;}return u;}
function mgValue(){const C=G.cit;let v=0;for(const k in C.mg){const m=C.mg[k];v+=pxOf(+k)*m.n;}return v;}
function stockValue(){const C=G.cit;let v=0;for(const k in C.pos){const p=C.pos[k];v+=(p.t.n+p.n.n)*pxOf(+k);}return v;}
function fundNav(){const C=G.cit;return C.ixv.m*10*C.fund.fee;}  // 基準価額(1万口)
function fundValue(){const C=G.cit;return C.fund.u*fundNav()/1e4;}
function citNW(){const C=G.cit;return C.cash+stockValue()+fundValue()+mgUnreal();}
function reserved(){const C=G.cit;let r=0;for(const o of C.orders){if(o.st==='open'&&o.kind==='cash'&&o.side>0)r+=o.rsv;}return r;}
function committed(cid,acc){const C=G.cit;let n=0;for(const o of C.orders)if(o.st==='open'&&o.kind==='cash'&&o.side<0&&o.cid===cid&&o.acc===acc)n+=o.qty-o.filled;return n;}
function mgLock(){return .3*mgValue();}
function mgEquity(){const C=G.cit;return C.cash+mgUnreal()+.8*stockValue();}
function mgRatio(){const v=mgValue();return v>0?mgEquity()/v:9;}
function buyPower(){const C=G.cit;return C.cash+Math.min(0,mgUnreal())-reserved()-mgLock();}
function nisaRoom(){const C=G.cit,N=C.nisa;return Math.max(0,Math.min(N.yr-N.used,N.lim-N.life));}
function citYear(){return dInfo(G.cit.dn).y;}
function say(t,cat,cid){const C=G.cit,x=dInfo(C.dn);C.news.unshift({D:C.D,dn:C.dn,k:C.k,t,cat:cat||'info',cid:cid||null});if(C.news.length>260)C.news.length=260;}
function notify(t,kind){const C=G.cit;C.notes.unshift({dn:C.dn,k:C.k,t,kind:kind||'info'});if(C.notes.length>120)C.notes.length=120;C.flash=t;}
function wageIdx(){const C=G.cit;return clamp(Math.pow((G.gdp/G.pop)/C.gp0,.85),.5,1e5);}
/* ---- 税・実現損益 ---- */
function realize(pnl,acc,cid,n,price){
 const C=G.cit;let tax=0;
 if(acc!=='n'){const b=C.ytd.real;C.ytd.real+=pnl;const d=Math.max(0,C.ytd.real)*TAXR-Math.max(0,b)*TAXR;C.cash-=d;C.ytd.tax+=d;tax=d;C.life.tax+=d;}
 C.ytd.pnl+=pnl;C.life.real+=pnl;
 C.rl.unshift({dn:C.dn,cid,n,pnl,tax,acc,px:price});if(C.rl.length>200)C.rl.length=200;}
function logFill(o,n,px,extra){const C=G.cit,c=co(o.cid);
 const f={id:o.id,dn:C.dn,k:C.k,cid:o.cid,name:c?c.name:'?',side:o.side,kind:o.kind,acc:o.acc,n,px,amt:n*px};if(extra)Object.assign(f,extra);
 C.fills.unshift(f);if(C.fills.length>300)C.fills.length=300;}
/* ---- 約定処理 ---- */
function applyFill(o,n,px){
 const C=G.cit,c=co(o.cid);if(!n)return;
 o.filled+=n;o.sum=(o.sum||0)+n*px;o.avg=o.sum/o.filled;
 if(o.kind==='cash'){
  const P=posOf(o.cid),a=P[o.acc];
  if(o.side>0){const cost=n*px;C.cash-=cost;o.rsv=Math.max(0,o.rsv-cost);a.n+=n;a.cost+=cost;if(o.acc==='n'){C.nisa.used+=cost;C.nisa.life+=cost;}
   logFill(o,n,px);notify(`【約定】${c.name} 現物買 ${n}株 @${px.toFixed(px<1000?1:0)}`,'buy');}
  else{const avg=a.n?a.cost/a.n:px,pnl=(px-avg)*n;a.n-=n;a.cost-=avg*n;if(a.n<=0){a.n=0;a.cost=0;}C.cash+=n*px;if(o.acc==='n')C.nisa.free+=avg*n;
   realize(pnl,o.acc,o.cid,n,px);logFill(o,n,px,{pnl});notify(`【約定】${c.name} 現物売 ${n}株 @${px.toFixed(px<1000?1:0)} 損益${pnl>=0?'+':''}${Math.round(pnl).toLocaleString()}円`,pnl>=0?'win':'loss');}
 }else if(o.kind==='mo'){
  const m=C.mg[o.cid];if(!m)C.mg[o.cid]={side:o.side,n,avg:px,D:C.D};else{m.avg=(m.avg*m.n+px*n)/(m.n+n);m.n+=n;}
  logFill(o,n,px);notify(`【約定】${c.name} 信用新規${o.side>0?'買':'売'} ${n}株 @${px.toFixed(px<1000?1:0)}`,'buy');
 }else{ // mc 返済
  const m=C.mg[o.cid];if(!m)return;const pnl=m.side*(px-m.avg)*n;m.n-=n;C.cash+=pnl;if(m.n<=0)delete C.mg[o.cid];
  realize(pnl,'t',o.cid,n,px);logFill(o,n,px,{pnl});notify(`【約定】${c.name} 信用返済${o.side>0?'買':'売'} ${n}株 @${px.toFixed(px<1000?1:0)} 損益${pnl>=0?'+':''}${Math.round(pnl).toLocaleString()}円`,pnl>=0?'win':'loss');}
 if(o.filled>=o.qty){o.st='done';}
}
function finishOrder(o,st){o.st=st;if(st!=='open')o.rsv=0;}
/* ---- 注文の受付 ---- */
function citOrder(a){
 const C=G.cit,c=co(a.cid);if(!c||!isT(c))return err('その銘柄は取引できません');
 if(C.k>=NB&&a.type==='mkt')return err('市場は閉まっています。成行注文は取引時間中のみです');
 const qty=Math.floor(a.qty/LOT)*LOT;if(!(qty>0))return err(`数量は${LOT}株単位で入力してください`);
 const side=a.side>0?1:-1,kind=a.kind||'cash',acc=kind==='cash'?(a.acc||'t'):'t';
 const type=a.type||'mkt',px=a.px?rt(a.px):null,trig=a.trig?rt(a.trig):null;
 const d=dayData(c),now=cpx(c),prev=rt(d.prev);
 if(type==='lim'&&!(px>0))return err('指値の価格を入力してください');
 if(type==='stp'&&!(trig>0))return err('逆指値のトリガー価格を入力してください');
 if(px&&(px<prev*.7||px>prev*1.3))return err('値幅制限(前日終値の±30%)の範囲外です');
 if(C.call&&(kind==='mo'||(kind==='cash'&&side>0)))return err('追証が発生しています。新規の買付・建玉はできません');
 const b=orderBook(c),est=type==='lim'?px:(side>0?b.asks[0].p*1.03:b.bids[0].p);
 const o={id:C.oid++,cid:c.id,side,kind,acc,qty,filled:0,type,px,trig,valid:a.valid==='wk'?'wk':'day',D:C.D,exp:C.D+(a.valid==='wk'?4:0),st:'open',rsv:0,sum:0,avg:0,trg:false,t:{dn:C.dn,k:C.k}};
 if(kind==='cash'){
  if(side>0){
   const cost=qty*est;if(cost>buyPower()+1e-6)return err('買付余力が足りません');
   if(acc==='n'&&qty*est>nisaRoom()+1e-6)return err('NISAの非課税枠が足りません');
   o.rsv=cost;
  }else{
   const p=posOf(c.id);if(qty>p[acc].n-committed(c.id,acc))return err('売却できる株数が足りません');
  }
 }else if(kind==='mo'){
  const m=C.mg[c.id];if(m&&m.side!==side)return err('反対売買は「返済」で行ってください');
  const need=.3*(mgValue()+qty*est);if(mgEquity()<need)return err('委託保証金が足りません(必要率30%)');
 }else{
  const m=C.mg[c.id];if(!m)return err('建玉がありません');if(m.side===side)return err('返済は建玉と反対の売買です');if(qty>m.n)return err('建玉数量を超えています');
 }
 C.orders.unshift(o);
 immediate(o,c);
 if(o.st==='open'&&type==='mkt'){finishOrder(o,'cxl');return err('板に注文がなく、約定しませんでした');}
 return ok(o.st==='done'?'約定しました':'注文を受け付けました');
}
/* 成行・即時約定できる指値は板で約定 */
function immediate(o,c){
 const C=G.cit;if(C.k<=0&&o.type!=='mkt'&&o.type!=='lim'){return;}
 if(o.type==='stp')return;
 if(C.k<=0&&o.type==='lim'){return;}       // 寄り前の指値は寄付き(次のバー)で判定
 const lim=o.type==='lim'?o.px:null;
 const r=walk(c,o.side,o.qty-o.filled,lim);
 if(r.n){const cap=C.imp[c.id]||0;applyFill(o,r.n,Math.round(r.avg*100)/100);
  const base=cpx(c);C.imp[c.id]=clamp(cap+(r.last/Math.max(1e-9,base)-1)*.6,-.3,.3);}
 if(o.type==='mkt'&&o.st==='open'&&o.filled>0)finishOrder(o,'done');
}
function citCancel(id){const C=G.cit,o=C.orders.find(x=>x.id===id);if(!o||o.st!=='open')return err('取消できません');finishOrder(o,'cxl');return ok('注文を取り消しました');}
/* ---- バーごとの注文判定(ザラ場の約定) ---- */
function processOrders(j0,j1){
 const C=G.cit;
 for(const o of C.orders){if(o.st!=='open')continue;const c=co(o.cid);if(!c||!isT(c)){finishOrder(o,'cxl');continue;}
  const d=dayData(c);
  for(let j=j0;j<=j1&&o.st==='open';j++){
   const p=d.p[j];
   if(o.type==='stp'&&!o.trg){if(o.side>0?p>=o.trig:p<=o.trig){o.trg=true;
     const tk=tickX(p),q=o.qty-o.filled,slip=tk*(1+Math.floor(q/Math.max(LOT,d.vol*.04)));const fp=o.side>0?p+slip:Math.max(.1,p-slip);
     if(o.px&&(o.side>0?fp>o.px:fp<o.px)){o.type='lim';}else{applyFill(o,q,rt(fp));if(o.filled>=o.qty)break;}}continue;}
   if(o.type==='lim'||(o.type==='stp'&&o.trg&&o.px)){
    const L=o.px,tk=tickX(L),q=o.qty-o.filled;
    if(o.side>0?p<=L-tk*.99:p>=L+tk*.99){applyFill(o,q,o.side>0?Math.min(L,rt(p)):Math.max(L,rt(p)));}
    else if(o.side>0?p<=L:p>=L){const part=Math.min(q,Math.max(LOT,Math.round(d.vol*.05/LOT)*LOT));if(Math.random()<.4)applyFill(o,part,L);}
   }
  }
 }
 if(C.orders.length>150){let n=0;C.orders=C.orders.filter(o=>o.st==='open'||++n<=100);}
}
/* ---- 1本進める ---- */
function citBar(){
 const C=G.cit;if(C.k>=NB)return false;
 const j0=C.k===0?0:C.k*SUB+1;C.k++;const j1=C.k*SUB;
 for(const id in C.imp){C.imp[id]*=.72;if(Math.abs(C.imp[id])<.0003)delete C.imp[id];}
 processOrders(j0,j1);
 releaseNews();
 if(C.k>=NB)citClose();
 return true;
}
function citToClose(){const C=G.cit;let n=0;while(C.k<NB&&n++<60)citBar();}
/* ---- ニュースの配信(四半期の世界の出来事を日付に割り振り) ---- */
function releaseNews(){const C=G.cit;
 while(C.pend.length&&(C.pend[0].i<C.dq||(C.pend[0].i===C.dq&&C.pend[0].k<=C.k))){const x=C.pend.shift();say(x.t,x.cat,x.cid);}}
/* ---- 引け後の処理 ---- */
function citClose(){
 const C=G.cit,tl=tradables();if(C.closed===C.D)return;C.closed=C.D;
 const x=dInfo(C.dn);
 // 日足・指数
 let prevMc=0,mcNow=0,w30=0,wp30=0;
 const top30=C.t30||[];
 let sM=0,wM=0,s30=0,w30s=0;const secR={},secW={};
 for(const c of tl){const d=dayData(c),cl=rt(d.close),pv=rt(d.prev);
  const st=dstat(c);
  c.dh=c.dh||[];c.dh.push([+d.p[0].toFixed(1),+Math.max(...d.p).toFixed(1),+Math.min(...d.p).toFixed(1),+cl.toFixed(1),Math.round(d.vol)]);if(c.dh.length>90)c.dh.shift();
  c.dl=cl;                       // 直近終値
  if(x.wd===5||C.dq===C.nq-1){c.wk=c.wk||[];c.wk.push(+cl.toFixed(1));if(c.wk.length>156)c.wk.shift();}
  const wgt=pv*c.S,r=cl/pv-1;sM+=wgt*r;wM+=wgt;if(top30.includes(c.id)){s30+=wgt*r;w30s+=wgt;}
  secR[c.sector]=(secR[c.sector]||0)+wgt*r;secW[c.sector]=(secW[c.sector]||0)+wgt;}
 const rM=wM?sM/wM:0,r30=w30s?s30/w30s:rM;
 C.ixc.m=C.ixv.m*(1+0);   // 当日値は下で確定
 const m0=C.ixc.m0;C.ixv.m=m0*(1+rM);C.ixv.t=C.ixc.t0*(1+r30);
 C.ixh.m.push(+C.ixv.m.toFixed(2));C.ixh.t.push(+C.ixv.t.toFixed(2));if(C.ixh.m.length>1400){C.ixh.m.shift();C.ixh.t.shift();}
 C.secr={};for(const s in secR)C.secr[s]=secR[s]/secW[s];
 C.rM=rM;
 say(`【大引け】瑞穂総合 ${C.ixv.m.toFixed(2)}(${rM>=0?'+':''}${(rM*100).toFixed(2)}%)。値上がり${tl.filter(c=>rt(dayData(c).close)>rt(dayData(c).prev)).length}・値下がり${tl.filter(c=>rt(dayData(c).close)<rt(dayData(c).prev)).length}`,'mkt');
 // 注文の期限
 for(const o of C.orders)if(o.st==='open'&&C.D>=o.exp)finishOrder(o,'cxl');
 // 信用の金利・貸株料
 const gap=Math.max(1,(C.dnNext||C.dn+1)-C.dn);
 for(const k in C.mg){const m=C.mg[k],v=pxOf(+k)*m.n;const rate=m.side>0?.028:.011;const f=v*rate/365*gap;C.cash-=f;C.ytd.int+=f;}
 fundFee();
 // 追証
 const ratio=mgRatio();
 if(Object.keys(C.mg).length){
  if(ratio<.2){if(!C.call){C.call=C.D;notify(`【追証】委託保証金率が${(ratio*100).toFixed(1)}%に低下。3営業日以内に20%以上へ回復させてください`,'call');}
   else if(C.D-C.call>=3||ratio<.1){forceClose();}}
  else if(C.call){C.call=0;notify('【追証解消】委託保証金率が回復しました','info');}
 }else C.call=0;
 // 配当(四半期末)
 if(C.dq===C.nq-1)payDividends();
 // 上場廃止(四半期末)
 if(C.dq===C.nq-1)delistDead();
 // 給与・生活費・賞与(月末)、つみたて(月初)
 const nx=nextTD(C.dn),xn=dInfo(nx);C.dnNext=nx;
 if(xn.m!==x.m)monthEnd(x);
 if(xn.m!==x.m)C.fund.due=true;
 if(xn.y!==x.y)yearEnd(x.y);
 // 資産推移・TWR
 const nw=citNW(),fl=C.flowD;C.flowD=0;
 const base=C.lastNW||nw;if(base>0){const r=(nw-fl)/base-1;C.twr*=1+r;}
 C.lastNW=nw;C.nwh.push([C.dn,Math.round(nw),+C.twr.toFixed(5),+C.ixv.m.toFixed(2)]);if(C.nwh.length>1400)C.nwh.shift();
 milestones(nw);
}
function forceClose(){const C=G.cit;let lost=0;
 for(const k in C.mg){const m=C.mg[k],c=co(+k);if(!c)continue;const px=pxOf(+k)*(1-.003*m.side);const pnl=m.side*(px-m.avg)*m.n;C.cash+=pnl;realize(pnl,'t',+k,m.n,px);lost+=pnl;
  logFill({id:0,cid:+k,side:-m.side,kind:'mc',acc:'t'},m.n,px,{pnl,forced:true});}
 C.mg={};C.call=0;notify(`【強制決済】追証が解消されず、建玉を全て強制決済されました(損益${Math.round(lost).toLocaleString()}円)`,'loss');say('信用取引の強制決済(追証未解消)','own');}
function payDividends(){
 const C=G.cit;let tot=0,net=0;
 for(const k in C.pos){const c=co(+k);if(!c||!c.dvh||!c.dvh.length)continue;const dps=c.dvh[c.dvh.length-1]*1e4/c.S;if(dps<=0)continue;
  const P=C.pos[k],gt=P.t.n*dps,gn=P.n.n*dps;if(gt+gn<=0)continue;
  const tax=gt*TAXR;C.cash+=gt-tax+gn;C.ytd.div+=gt+gn;C.life.div+=gt+gn;C.ytd.dtax+=tax;tot+=gt+gn;net+=gt-tax+gn;
  C.dv.unshift({dn:C.dn,cid:+k,dps,n:P.t.n+P.n.n,gross:gt+gn,tax});}
 for(const k in C.mg){const m=C.mg[k],c=co(+k);if(!c||!c.dvh||!c.dvh.length)continue;const dps=c.dvh[c.dvh.length-1]*1e4/c.S;if(dps<=0)continue;const a=m.side*m.n*dps*(1-(m.side>0?TAXR:0));C.cash+=a;}
 if(C.dv.length>200)C.dv.length=200;
 if(tot>0)notify(`【配当】配当金 ${Math.round(tot).toLocaleString()}円(税引後 ${Math.round(net).toLocaleString()}円)が入金されました`,'div');
}
function delistDead(){
 const C=G.cit;
 for(const c of G.companies){if(c.alive||c.dlq!==C.qi)continue;
  const P=C.pos[c.id];let n=0,cost=0;if(P){n=P.t.n+P.n.n;cost=P.t.cost+P.n.cost;
   if(n>0){const pt=-P.t.cost,pn=-P.n.cost;if(P.t.n>0)realize(-P.t.cost,'t',c.id,P.t.n,0);if(P.n.n>0)realize(-P.n.cost,'n',c.id,P.n.n,0);}delete C.pos[c.id];}
  const m=C.mg[c.id];if(m){const pnl=m.side*(0-m.avg)*m.n;C.cash+=pnl;realize(pnl,'t',c.id,m.n,0);delete C.mg[c.id];}
  for(const o of C.orders)if(o.cid===c.id&&o.st==='open')finishOrder(o,'cxl');
  C.wl=C.wl.filter(x=>x!==c.id);
  say(`【上場廃止】${c.name}が上場廃止になりました${n>0?'(保有株は無価値に)':''}`,'own',c.id);
  if(n>0)notify(`【上場廃止】${c.name}が上場廃止。保有${n}株は無価値となり損失${Math.round(cost).toLocaleString()}円を確定`,'loss');
  c.dlq=null;c.tq=null;c.listed=false;}
 RT.tl=null;
}

 for(const m of L){if(nw>=m&&!(C.ms[m])){C.ms[m]=1;const t=m>=1e8?(m/1e8)+'億円':(m/1e4)+'万円';notify(`🎉 総資産が${t}を突破しました`,'win');say(`あなたの総資産が${t}を突破`,'own');}}}

function cfBuy(amt,acc,auto){const C=G.cit,F=C.fund;amt=Math.floor(amt);if(!(amt>0))return err('金額を入力してください');

function cfSell(frac){const C=G.cit,F=C.fund;if(F.u<=0)return err('保有がありません');
 const u=F.u*clamp(frac,0,1),v=u*fundNav()/1e4,cost=F.cost*(u/F.u);const nf=F.cn*(u/F.u);
 C.cash+=v;F.u-=u;F.cost-=cost;F.cn-=nf;C.nisa.free+=nf;
 const pnl=v-cost,taxable=pnl*(1-(nf/Math.max(1e-9,cost)));realize(pnl-(nf>0?pnl*(nf/Math.max(1e-9,cost)):0),'t',0,0,0);

function snapFs(c){return {earn:c.earn,K:c.K,cash:c.cash,debt:c.debt,profit:c.profit,rev:c.rev,dv:(c.dvh||[]).reduce((a,b)=>a+b,0),dl:(c.dvh||[]).length?c.dvh[c.dvh.length-1]:0};}
function citRoll(first){
 const C=G.cit;
 if(G.elect)resolveElection('accept');
 G.notice=null;
 const L0=new Set();
 for(const c of G.companies){if(!c.alive)continue;c.q0=c.price;c.fs=c.fsn||snapFs(c);if(c.listed)L0.add(c.id);}
 C.qi=first?0:C.qi+1;
 const top=G.log[0];
 step();G.over=null;G.elect=null;
 const logNew=[];for(const l of G.log){if(l===top)break;logNew.push(l);}
 const nm={};
 for(const c of G.companies){
  if(c.alive&&first&&L0.has(c.id)&&c.tq==null)c.tq=0;
  if(c.alive&&c.listed&&c.tq==null&&!L0.has(c.id)){c.tq=C.qi+1;}
  if(c.alive&&c.listed&&c.tq==null&&L0.has(c.id))c.tq=C.qi;
  if(!c.alive&&c.tq!=null&&c.tq<=C.qi&&c.listed&&c.dlq==null&&c.q0!=null&&!c.dead){c.dlq=C.qi;c.dead=true;}
  if(c.alive)c.fsn=snapFs(c);
 }
 for(const c of G.companies){
  if(!(c.q0!=null))continue;
  if(c.alive)c.q1=c.price;else if(c.dlq===C.qi){c.q1=Math.max(.5,c.q0*.04);}
  c.fsn=c.fsn||snapFs(c);
 }
 // 株式分割
 const splits=[];
 for(const c of G.companies){if(!(c.alive&&c.tq!=null&&c.tq<=C.qi&&c.q1))continue;
  if(c.q1>3000&&c.q0>2000){const k=clamp(Math.round(c.q1/700),2,10);splitCo(c,k);splits.push([c,k]);}}
 RT.tl=null;RT.q={};RT.d={};RT.bk={};
 // 営業日数
 const q=qOf(C.dn);C.qi=q;let n=0,dn=C.dn;while(qOf(dn)===q){if(isTD(dn))n++;dn++;}C.nq=n;C.dq=0;
 // ニュース配分
 C.pend=[];
 const tl=tradables(),byName={};for(const c of tl)byName[c.name]=c.id;
 for(const l of logNew.reverse()){let cid=null;for(const nme in byName){if(l.t.includes(nme)){cid=byName[nme];break;}}
  C.pend.push({i:Math.floor(Math.random()*n),k:1+Math.floor(Math.random()*NB),t:l.t.replace(/^[^　-鿿\w【]*\s*/,''),cat:l.k==='bad'?'bad':l.k==='good'?'good':'info',cid});}
 for(const c of tl){const ann=annDay(c);const f0=c.fs,f1=c.fsn;if(!f0||!f1)continue;
  const ch=f0.earn?(f1.earn-f0.earn)/Math.abs(f0.earn):0;
  const t=f1.earn<0&&f0.earn>=0?'赤字に転落':f1.earn>=0&&f0.earn<0?'黒字に転換':ch>.08?`増益(前期比${(ch*100).toFixed(0)}%増)`:ch<-.08?`減益(前期比${(-ch*100).toFixed(0)}%減)`:'ほぼ横ばい';
  const dvc=f1.dl>f0.dl*1.05?'・増配':f1.dl<f0.dl*.95?'・減配':'';
  C.pend.push({i:ann-1,k:3,t:`【決算】${c.name} 当期は${t}${dvc}。今期の最終利益${fm(f1.earn*4)}(年換算)`,cat:ch>.08?'good':ch<-.08?'bad':'info',cid:c.id,earn:true,newfs:c.id});}
 for(const [c,k] of splits)C.pend.push({i:0,k:1,t:`【株式分割】${c.name}が1株を${k}株に分割(本日から権利落ち)`,cat:'info',cid:c.id});
 for(const c of G.companies){if(c.alive&&c.listed&&c.tq===C.qi+1&&c.tq>C.qi&&!first)C.pend.push({i:n-1,k:20,t:`【新規上場】${c.name}が来期から上場します`,cat:'info',cid:c.id});
  if(c.dlq===C.qi)C.pend.push({i:Math.max(0,n-8),k:10,t:`【経営破綻】${c.name}が破産手続の開始を申し立て。整理銘柄に指定`,cat:'bad',cid:c.id});}
 C.pend.sort((a,b)=>a.i-b.i||a.k-b.k);
 // 指数の再基準
 const t30=tl.slice().sort((a,b)=>b.price*b.S-a.price*a.S).slice(0,30).map(c=>c.id);C.t30=t30;
 for(const c of tl)c.cph=(c.cph||[]),0;
 C.ixc.m0=C.ixv.m;C.ixc.t0=C.ixv.t;
 C.rtq=G.t;
}
function splitCo(c,k){const C=G.cit;

 if(c.dh)c.dh=c.dh.map(b=>[b[0]/k,b[1]/k,b[2]/k,b[3]/k,b[4]*k]);if(c.wk)c.wk=c.wk.map(x=>x/k);if(c.cph)c.cph=c.cph.map(x=>x/k);if(c.dl)c.dl/=k;
 const P=C.pos[c.id];if(P){P.t.n*=k;P.n.n*=k;}
 const m=C.mg[c.id];if(m){m.n*=k;m.avg/=k;}
 for(const o of C.orders)if(o.cid===c.id&&o.st==='open'){o.qty*=k;o.filled*=k;if(o.px)o.px/=k;if(o.trig)o.trig/=k;o.sum/=1;}
 c.fs=c.fs;}

function corpEvStep(){

 let n=1+(rnd()<.6?1:0)+(rnd()<Math.min(.55,al.length/90)?1:0)+(al.length>150&&rnd()<.5?1:0);
 for(let k=0;k<n;k++){
  let tw=0;const w=al.map(c=>{const x=Math.sqrt(Math.max(1,c.rev||1))*(c.listed?1.6:.5);tw+=x;return x;});
  let r=rnd()*tw,i=0;for(;i<al.length-1;i++){r-=w[i];if(r<=0)break;}
  const c=al[i],pool=CEV.filter(e=>!e.ok||e.ok(c));let t2=pool.reduce((a,e)=>a+e.w,0),x=rnd()*t2;
  for(const e of pool){x-=e.w;if(x<=0){const [t,kd,b]=e.f(c);news(t,kd,b);if(kd==='bad'&&!(ctrlKey(c)==='state'))scoop();break;}}
 }
}
function evStep(){
 for(let k=0;k<2;k++){
  if(rnd()>(k?.2:.34))continue;
  const pool=PEV.filter(e=>!e.ok||e.ok());let tw=pool.reduce((a,e)=>a+e.w,0),x=rnd()*tw;
  for(const e of pool){x-=e.w;if(x<=0){e.f();break;}}
 }
 if(rnd()<.2){const tw=EVENTS.reduce((a,e)=>a+e.w,0);let r=rnd()*tw;for(const e of EVENTS){r-=e.w;if(r<=0){e.f();break;}}}
 corpEvStep();if(typeof hitStep==='function')hitStep();
 if(typeof snsStep==='function')snsStep();
}

 const h=nh2(l,c.id,1),h2=nh2(l,c.id,2),h3=nh2(l,c.id,3);
