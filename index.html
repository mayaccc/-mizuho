 if(mine)cov=1;

 if(v.k==='nei'){const n=neiOf(v.tid);if(n)n.rel=Math.max(-100,n.rel-14);}else{const c=co(v.tid);if(c&&c.alive){c.rep=clamp((c.rep||0)-.3,-1,1);addBump(c,-.06,6);}}

function hnStep(){
 if(G.year<1890||(typeof isOpp==='function'&&isOpp()))return;const H=hnInit();

  if(v){v.who=pick(HN_ROLE);v.age=0;v.found=false;H.vic.push(v);}}
 for(const v of H.vic.slice()){v.age++;

function pSpyLaw(lv){if(typeof isOpp==='function'&&isOpp())return err('野党は法律を作れません');const H=hnInit();
 if(G.year<1900)return err('まだ国際的な諜報戦の時代ではありません');if(lv===H.law)return err('既にその段階です');if(lv<0||lv>2)return err('不明な段階です');
 const up=lv>H.law,c=up?HN_LAW[lv].cost:6;if(up&&G.pol.minority)return err('少数与党では法案を通せません');if(G.pol.pc<c)return err(`政治資本が足りません(必要${c})`);
 G.pol.pc-=c;H.law=lv;
 if(up){G.pol.approval=clamp(G.pol.approval+HN_LAW[lv].ap,.05,.9);G.reg.forEach(r=>r.unrest=Math.min(100,r.unrest+HN_LAW[lv].un));

function pSpyProbe(){if(typeof isOpp==='function'&&isOpp())return err('野党は調査できません');const H=hnInit();if(H.law<1)return err('スパイ防止法がないと、法的根拠のある調査はできません');
 if(G.t-H.probe<4)return err('調査は1年に1回までです');const cost=Math.max(8,Math.round(G.gdp*.001));if(G.treasury<cost)return err('国庫が足りません');if(G.pol.pc<3)return err('政治資本が足りません(必要3)');
 G.treasury-=cost;G.pol.pc-=3;H.probe=G.t;const v=H.vic.length?H.vic[0]:null;

(function(){

/* ===== 野党の企業献金と企業票(自党寄りの企業に限る) ===== */
const CV_K=['anti','labor','fcap','mon','dip','ins'];
function cvParties(){const pp=G.pol;return PARTIES.concat(G.xpd||[]).filter(p=>p&&(pp.seats[p.id]!=null||p.id===pp.me));}
function coLean(c){if(!c.pv){c.pv={anti:rnd()*.5,labor:rnd()*.5,fcap:rnd(),mon:rnd(),dip:rnd(),ins:rnd()*.5};}
 const k=ctrlKey(c);if(k&&k[0]==='z'){const z=zOf(k);if(z&&z.party&&partyOf(z.party))return z.party;}
 let best=null,bd=9,dm=null;const me=G.pol.me;for(const p of cvParties()){if(!p.ideal)continue;let d=0;for(const x of CV_K)d+=Math.pow((p.ideal[x]||0)-c.pv[x],2);if(p.id===me)dm=d;if(d<bd){bd=d;best=p.id;}}
 return dm!=null&&dm<=bd+.12?me:best;}
function cvShare(c){let t=0;for(const x of lstCo())t+=Math.max(1,x.price*x.S/1e4);return Math.max(1,c.price*c.S/1e4)/Math.max(1,t);}
function cvList(){const me=G.pol.me;return lstCo().filter(c=>{const k=ctrlKey(c);return k!=='state'&&k!=='loc'&&coLean(c)===me;}).sort((a,b)=>cvShare(b)-cvShare(a));}

 if(coLean(c)!==G.pol.me)return err('自党寄りの企業にしか献金を求められません');const pp=G.pol;if(!pp.cv)pp.cv={};const e=pp.cv[cid]||(pp.cv[cid]={lvl:0,t:-99});
 if(G.t-e.t<4)return err(`この企業にはあと${4-(G.t-e.t)}四半期は頼めません`);const s=scl2(),cost=Math.round(35*s);const y=fundNeed(cost);if(y)return y;
 e.t=G.t;e.lvl=Math.min(1.5,e.lvl+.5);
 return ok(`${c.name}の経営陣に会い、後援を得ました。${c.name}の取引先・社員・株主の票が${mpn()}に向かいます(企業票+)`);}

 const dpr=window.devicePixelRatio||1,w=cv.clientWidth||320,h=cv.clientHeight||120;cv.width=w*dpr;cv.height=h*dpr;
 const x=cv.getContext('2d');if(!x)return;x.scale(dpr,dpr);
 let mn=Infinity,mx=-Infinity;series.forEach(s=>s.d.forEach(v=>{if(v<mn)mn=v;if(v>mx)mx=v;}));if(!isFinite(mn))return;
 if(mx===mn){mx+=1;mn-=1;}const pd=(mx-mn)*.08;mn-=pd;mx+=pd;
 x.strokeStyle=cssv('--outline-variant');x.lineWidth=1;for(let i=0;i<=2;i++){const y=Math.round((h-1)*i/2)+.5;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke();}
 series.forEach(s=>{x.strokeStyle=s.c||cssv('--primary');x.lineWidth=2;x.lineJoin='round';x.beginPath();s.d.forEach((v,i)=>{const px=s.d.length>1?i/(s.d.length-1)*(w-2)+1:w/2,py=h-(v-mn)/(mx-mn)*(h-6)-3;i?x.lineTo(px,py):x.moveTo(px,py);});x.stroke();});
 x.fillStyle=cssv('--on-surface-variant');x.font='11px sans-serif';const f=o.fmt||(v=>v.toFixed(0));x.fillText(f(mx),4,12);x.fillText(f(mn),4,h-5);}

 openSheet(`<h2>${c.name}</h2><div class="mut" style="margin-bottom:6px">${SECT[c.sector].n}・${regName(c.reg)} ${c.alive?statusTags(c):'<span class="tag r">倒産</span>'}</div>

 ${coMedia(c)}${coExtra(c)}<h3 style="margin:14px 0 4px;font-size:14px;font-weight:500">株主構成</h3><div class="stack">${hs.map(([k,v])=>`<span style="width:${v/c.S*100}%;background:${holdCol(k)}"></span>`).join('')}</div>
 <div class="leg">${hs.map(([k,v])=>`<span><i style="background:${holdCol(k)}"></i>${hold2(k)} ${pct(v/c.S)}</span>`).join('')}</div>

function showHelp(){openSheet(`<h2>遊び方</h2><div style="line-height:1.75;font-size:13.5px">
 <p><b>経済</b>:税・関税・予算配分を決め、会社を興し(官営/民間補助/財閥委託)、株式市場で国有株を売買。需要が余る産業に参入するほど儲かり、過剰な産業は価格戦争と倒産に。倒産は銀行・失業・金融危機へ波及します。</p>
 <p><b>財閥</b>:会社を興し、買収し、ライバルと対立。優遇・仲裁・解体で手綱を握り、独占規制で抑え込むことも。</p>
 <p><b>政治</b>:政党(政友会・民政党・労働党・国粋党)と選挙、連立。13分野の政策(移民・参政権・労働・外交・農地…)を<b>政治資本</b>を使って変更します。政策は各党の理想と一致するほど支持が集まり、食い違うと連立が壊れます。</p>
 <p><b>選挙</b>:4年ごとの総選挙で、与党+連立が過半数(151)を割ると<b>政権を失い野党になります(ゲームは続行)</b>。選挙戦(1年前から)で公約・公共事業の配分ができ、さらに<b>金配り・野党妨害・投票妨害・区割り操作・選挙延期・開票結果の改ざん</b>という不正も選べます。ただし不正は国民の不満度を上げ、発覚度が溜まると発覚・民衆蜂起で失脚(野党転落)します。</p>
 <p><b>野党</b>:選挙に敗れると、別の党が組閣します。野党は政策・予算・企業・外交には介入できませんが、<b>遊説・全国大会・政権批判キャンペーン・選挙協力・内閣不信任案</b>と私財の運用で支持を伸ばせます。長く続く政権は「政権疲れ」で人気を失い、次の総選挙(または不信任→解散)で過半数を握れば<b>政権奪還</b>。スタート画面で<b>新党を結成して野党から始める</b>こともできます。政党は世相しだいで勝手に新党が生まれたり、支持を失って消えたりします。</p>
 <p><b>宗教</b>:神道・仏教・外来教会のほか新しい宗教団体が生まれ、信者や資金で政治に影響します。「政策→統治」の<b>政教分離</b>で国教制〜厳格な分離を選べますが、分離後も新興宗教が裏で政党とつながっていることがあります。民主国家では解散命令、独裁・社会主義体制では弾圧(社会主義なら全面禁止)ができます。信者が増えると政治団体が結成されることも。「政治→宗教」で確認。</p>
 <p><b>移民</b>:受入れで人口・労働力・技術が増えますが、同化政策次第で摩擦と排外主義が高まります。</p>
 <p><b>勢力図</b>:6地域ごとの財閥・政党・不満・移民を地図で確認。不満が高い地域は反乱を起こし、統治力を失うと生産が落ちます。投資・軍の派遣・自治拡大で対処。</p>
 <p><b>外交</b>:北邦・大陸・南洋との関係を管理し、貿易・条約・同盟、そして戦争。戦争は軍事力と同盟で決まります。</p>
 <p><b>政策(全46分野)</b>:経済・社会・移民民族・統治選挙・安保外交の5分類。税制、貿易、産業政策、教育、医療、少子化、警察、司法の独立、選挙制度(小選挙区/比例)、議員任期、軍需産業、国際協調…。政策ごとに財政負担・不満・技術・人口・戦争リスクなどへ効果があり、各党の満足度も変わります。コストは政治資本です。</p>
 <p><b>株式市場</b>:銘柄ごとにPER・PBR・ROE・配当利回り・年高安を確認でき、市場全体の平均PERや時価総額/GDP(バブル指標)も見られます。割安株を国が買って官営にしたり、割高な国有株を高値で売り抜けましょう。</p>
 <p><b>報道</b>:新聞・通信・配信の会社が「マスコミ」。官営なら論調(中立・御用・特定政党寄り)を決められ、民間は経営者や財閥の思想で偏ります。支持率・議席予測・ニュースは<b>選んだ報道機関の色眼鏡</b>を通して見えるので、独自の世論調査で本当の数字を確かめましょう。中立でも官営は政府にやや甘く、御用は信頼を失うと効かなくなります。</p>
 <p><b>法・風紀</b>:薬物、売買春、賭博、死刑、禁酒、囚人労働、思想警察、拷問、婚姻・家族法など、論争的な法制度も政策タブの「法・風紀」で選べます。税収や経済の見返りがある一方、世論の反発、不祥事、人権問題などの代償があります。</p>
 <p><b>マクロ経済</b>:失業率は景気(稼働率)と自然失業率で決まり、賃金は生産性・労働需給・物価・労働政策で動きます。賃金が高すぎると企業利益が、低すぎると消費が冷えます。国債は国内消化と外債(海外の投資家が引受・利回りは高め)を選んで発行できます。国庫から会社への政府融資(低利・資本の80%まで・倒産すると焦げ付き)も、各会社の詳細画面から行えます。国債は国庫を補いますが、利払いと公債残高が増えると利回りが上がり、民間の資金も吸われます。不良債権が膨らむと銀行が貸し渋ります。「経済→マクロ」で確認し、国債の発行・償還や賃金ガイドラインで舵を取れます。</p>
 <p><b>企業グループ</b>:大きく育った会社は、鉄道なら百貨店・ホテル・不動産、通信なら情報・放送など、本業の周辺に自ら子会社を作り、同業や周辺の会社を買収してグループを形成します。親会社は子会社から配当を受け、苦しい子会社を支援します。「経済→グループ」で一覧できます。</p>
 <p><b>国民感情</b>:生活満足・政府への信頼・希望・不安・格差への怒り・主戦ムード・排外感情・愛国心、そして各国への好悪。経済や政策、報道、戦争で動き、支持率・不満・各党の支持・景気・戦争リスクにはね返ります。デモやストライキ、排外暴動、消費ブーム、反戦集会が起きることも。「政治→世論」で確認し、国民運動で世論工作もできます。</p>
 <p><b>海外株・ファンド</b>:取引所の「海外株」で北邦・大陸・南洋の株を国(政府系運用)や私財で売買できます(為替の影響を受け、交戦すると4割差し押さえ)。国内には<b>投資ファンド</b>(国内・外資)が現れ、割安株を買い、物言う株主は増配を要求し、さらにTOBで会社を奪うことも。法的措置・国の買い増し・財閥の防衛で阻止できます。外国資本政策が外資の動きを左右します。</p>
 <p><b>通貨・為替</b>:金本位・管理通貨・変動相場・ペッグの4制度。中央銀行を作ると政策金利・通貨増発・為替介入が使えます。通貨安は輸出に有利ですが物価高、通貨高は逆。固定相場は準備が尽きると通貨危機、増発しすぎるとハイパーインフレに。通貨の呼び名も変えられます。</p>
 <p><b>内部情報</b>:政権の内側には「発注内定」「増益」「捜査」などの情報が舞い込み、私財で先回り売買できます(確度は様々、外れや逆効果も)。ただし<b>疑惑度</b>が溜まると週刊誌→検察の内偵→発覚。握りつぶすか釈明するかを迫られ、3回の発覚で失脚です。稼いだ私財は選挙の不正工作の費用にも使えます。</p>
 <p>与党のとき、安定度が0に近づく政変や国庫が底を突く財政破綻でゲームオーバー(野党のときは政権が倒れ、解散総選挙になります)。自動保存されます。</p></div>
 <div class="opt"><button class="on" onclick="closeSheet()">閉じる</button></div>`);}

function electionChoice(c){
 const r=resolveElection(c);toast(r.m,r.ok?'ok':'err');save();renderAll();

function showElection(){
 const e=G.elect;if(!e)return;stop();const pp=G.pol,R=partyOf(pp.ruling);
 const tot=e.seats[pp.ruling]+(e.partner?e.seats[e.partner]:0);
 const rows=PARTIES.map(p=>li('',`<span style="color:${PCOL[p.id]}">●</span> ${p.name}${p.id===pp.ruling?'<span class="tag y">与党</span>':p.id===e.partner?'<span class="tag y">連立</span>':''}`,'得票率 '+pct(e.vote[p.id]),e.seats[p.id]+'議席')).join('');
 let body;
 if(!e.lost){
  body=`<div class="card hl" style="margin-top:10px"><b>政権維持</b><div style="font-size:13.5px">${R.name}${e.partner?'と'+partyOf(e.partner).name+'の連立':''}で${tot}議席。過半数(151)を確保しました。</div></div>
  <div class="opt"><button class="on" onclick="electionChoice('accept')">結果を受け入れて続投する</button></div>`;
 }else{
  const opts=[1,2,3].map(lv=>{const t=tamperInfo(lv);return `<button class="${t.enough?'':''}" style="flex-basis:100%;text-align:left" onclick="ask('${['小規模','中規模','大規模'][lv-1]}な改ざんを実行しますか?発覚すれば即失脚です',()=>electionChoice('tamper${lv}'),showElection)"><b>🗳️ 開票結果の改ざん(${['小','中','大'][lv-1]})</b><div style="font-size:12px;opacity:.85">${t.shift}議席を移す・成功率${pct(1-t.fail)}・${t.enough?'成功すれば政権維持':'<span class="neg">成功しても過半数に届かない</span>'}。成功しても不満+10、発覚度+${[20,35,50][lv-1]}</div></button>`;}).join('');
  body=`<div class="card" style="background:var(--error-container);color:var(--on-error-container);margin-top:10px"><b>与党は過半数を失いました</b><div style="font-size:13.5px">${R.name}は${tot}議席。連立でも過半数(151)に${e.need}議席足りません。内閣は総辞職し、野党が政権を握ります。</div></div>
  <div class="mut" style="font-size:12.5px;margin:10px 0 4px">…あるいは、手を汚すか。</div><div class="opt">${opts}</div>
  <div class="opt"><button onclick="ask('敗北を受け入れると、ゲームオーバーです',()=>electionChoice('accept'),showElection)">敗北を受け入れる(ゲームオーバー)</button></div>`;
 }
 openSheet(`<h2>${e.year}年 総選挙の開票</h2>${seatBar3(e.seats,true)}<div class="mut" style="font-size:12px;text-align:center;margin-bottom:6px">縦線=過半数(151議席)</div>${rows}${body}`);
}

function seatBar(seats,tot,ruling,partner,label){
 tot=tot||300;ruling=ruling===undefined?G.pol.ruling:ruling;partner=partner===undefined?G.pol.partner:partner;
 const lead=[];if(ruling&&partyOf(ruling))lead.push(ruling);if(partner&&partner!==ruling&&partyOf(partner))lead.push(partner);
 const ord=lead.concat(PARTIES.map(p=>p.id).filter(i=>!lead.includes(i)).sort((a,b)=>(seats[b]||0)-(seats[a]||0)));
 const me=G.pol.me;
 const segs=ord.map(id=>{const n=seats[id]||0,w=n/tot*100;if(n<=0)return '';
  return `<span style="width:${w}%;background:${PCOL[id]||'#888'};display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;${id===me?'box-shadow:inset 0 0 0 2px rgba(255,255,255,.85);':''}">${w>=7?n:''}</span>`;}).join('');
 const bl=lead.reduce((a,i)=>a+(seats[i]||0),0),ok=bl>tot/2;
 const br=lead.length?`<div style="display:flex;margin-top:2px"><div style="width:${bl/tot*100}%;height:7px;border:2px solid ${ok?'var(--good)':'var(--error)'};border-top:0;border-radius:0 0 6px 6px;box-sizing:border-box"></div></div>
  <div style="font-size:12px;margin-top:2px"><b class="${ok?'pos':'neg'}">${label||(lead.length>1?'連立':'単独')} ${lead.map(i=>partyOf(i).short).join('+')} ${bl}議席</b> <span class="mut">${ok?'(過半数)':'(過半数まであと'+(Math.floor(tot/2)+1-bl)+')'}</span></div>`:'';
 return `<div style="position:relative;padding-top:15px"><div style="position:absolute;left:${(Math.floor(tot/2)+1)/tot*100}%;top:0;transform:translateX(-50%);font-size:10px;line-height:13px;color:var(--on-surface-variant);white-space:nowrap">過半数${Math.floor(tot/2)+1}</div>
  <div class="stack" style="height:22px;border-radius:11px;margin:0">${segs}</div>
  <div style="position:absolute;left:${(Math.floor(tot/2)+1)/tot*100}%;top:13px;height:26px;border-left:2px dashed var(--on-surface)"></div>${br}</div>`;}
function seatBar3(seats,line,partner,ruling){return seatBar(seats,300,ruling,partner);}

 }else if(!e.lost){
  body=`<div class="card hl" style="margin-top:10px"><b>政権維持</b><div style="font-size:13.5px">${L.name}${e.partner?'と'+partyOf(e.partner).name+'の連立':''}で${tot}議席。${tot>150?'過半数(151)を確保しました。':'過半数には届かず、少数与党として政権を続けます。'}</div></div>

 }else{
  const opts=[1,2,3].map(lv=>{const t=tamperInfo(lv);return `<button style="flex-basis:100%;text-align:left" onclick="ask('${['小規模','中規模','大規模'][lv-1]}な改ざんを実行しますか?発覚すれば失脚し、野党に転落します',()=>electionChoice('tamper${lv}'),showElection)"><b>🗳️ 開票結果の改ざん(${['小','中','大'][lv-1]})</b><div style="font-size:12px;opacity:.85">${t.shift}議席を移す・成功率${pct(1-t.fail)}・${t.enough?'成功すれば政権維持':'<span class="neg">成功しても過半数に届かない</span>'}。成功しても不満+10、発覚度+${[20,35,50][lv-1]}</div></button>`;}).join('');
  body=`<div class="card" style="background:var(--error-container);color:var(--on-error-container);margin-top:10px"><b>与党は政権を失います</b><div style="font-size:13.5px">自党は${e.seats[me]}議席。連立でも過半数(151)に届かず、${L.name}${e.partner?'と'+partyOf(e.partner).name:''}が政権を握ります。あなたは野党に下り、政権奪還を目指します。</div></div>

function morph(a,b){const ac=a.childNodes,bc=b.childNodes;
 for(let i=0;i<bc.length;i++){const x=ac[i],y=bc[i];
  if(!x){a.appendChild(y.cloneNode(true));continue;}
  if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){a.replaceChild(y.cloneNode(true),x);continue;}
  if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue;}
  const xa=x.attributes,ya=y.attributes;
  for(let j=xa.length-1;j>=0;j--){const n=xa[j].name;if(!y.hasAttribute(n))x.removeAttribute(n);}
  for(let j=0;j<ya.length;j++){const n=ya[j].name,v=ya[j].value;if(x.getAttribute(n)!==v)x.setAttribute(n,v);}
  if(x.nodeName==='INPUT'){if(document.activeElement!==x){const v=y.getAttribute('value')||'';if(x.value!==v)x.value=v;}continue;}
  morph(x,y);
  if(x.nodeName==='SELECT'&&document.activeElement!==x){const o=y.querySelector('option[selected]');if(o&&x.value!==o.value)x.value=o.value;}}
 while(ac.length>bc.length)a.removeChild(a.lastChild);}

function sheetReset(){$('sheet').classList.remove('csh');}
function ordSet(k,v){ct.o[k]=v;if(k==='kind'){if(v==='mc'){const m=G.cit.mg[ct.o.cid];if(m){ct.o.side=-m.side;ct.o.qty=m.n;}}if(v==='mo'&&ct.o.kind==='mc')ct.o.side=1;}drawOrder();}
function ordQty(d){ct.o.qty=Math.max(0,(+ct.o.qty||0)+d);drawOrder();}
function ordAll(){const P=G.cit.pos[ct.o.cid];if(P){ct.o.qty=P[ct.o.acc].n;drawOrder();}}
function ordEst(){const o=ct.o,c=co(o.cid),b=orderBook(c);return o.type==='lim'||(o.type==='stp'&&+o.px)?(+o.px||0):(o.side>0?b.asks[0].p:b.bids[0].p);}
function ordSum(){const o=ct.o,e=$('osum');if(!e)return;const q=Math.floor((+o.qty||0)/LOT)*LOT,p=ordEst(),amt=q*p;
 let x=`<div class="kv"><span>概算代金</span><b>${yen(amt)}円</b></div>`;
 if(o.kind==='cash'&&o.side>0)x+=`<div class="kv"><span>買付余力</span><b>${yen(buyPower())}円</b></div>`+(o.acc==='n'?`<div class="kv"><span>NISA枠(今年残り)</span><b>${yen(nisaRoom())}円</b></div>`:'');
 else if(o.kind==='cash'){const P=G.cit.pos[o.cid];x+=`<div class="kv"><span>売却可能(${o.acc==='n'?'NISA':'特定'})</span><b>${yen(P?P[o.acc].n-committed(o.cid,o.acc):0)}株</b></div>`;}
 else if(o.kind==='mo')x+=`<div class="kv"><span>必要保証金(30%)</span><b>${yen(amt*.3)}円</b></div><div class="kv"><span>委託保証金余力</span><b>${yen(mgEquity()-.3*mgValue())}円</b></div>`;
 else{const m=G.cit.mg[o.cid];x+=`<div class="kv"><span>建玉</span><b>${m?(m.side>0?'買建 ':'売建 ')+yen(m.n)+'株':'なし'}</b></div>`;}

 if(o.side>0&&(o.kind==='cash'||o.kind==='mo')&&q>0&&p>0){let n0=0,c0=0;
  if(o.kind==='cash'){const P=G.cit.pos[o.cid];if(P&&P[o.acc].n>0){n0=P[o.acc].n;c0=P[o.acc].cost;}}
  else{const m=G.cit.mg[o.cid];if(m&&m.side>0){n0=m.n;c0=m.avg*m.n;}}
  if(n0>0){const a0=c0/n0,a1=(c0+q*p)/(n0+q);x+=`<div class="kv" style="background:#fff4e5;padding:6px 4px"><span>ナンピン後の平均取得単価</span><b>${pxS(a0)} → ${pxS(a1)} <span class="${a1<a0?'dn':''}">(${pc2(a1/a0-1)})</span></b></div><div class="kv"><span>平均まで株価が戻る必要</span><b>${p>=a1?'—(平均より上)':pc2(a1/p-1)}</b></div>`;}}
 e.innerHTML=x;}
function ordArgs(){const o=ct.o;return {cid:o.cid,side:o.side,kind:o.kind,acc:o.acc,qty:Math.floor((+o.qty||0)/LOT)*LOT,type:o.type,px:+o.px||null,trig:+o.trig||null,valid:o.valid};}
function ordConfirm(){const o=ct.o,c=co(o.cid),a=ordArgs();const buy=o.side>0;
 if(!(a.qty>0)){toast('数量を入力してください','err');return;}
 const typ={mkt:'成行',lim:'指値 '+pxS(a.px),stp:'逆指値 トリガー'+pxS(a.trig)+(a.px?' → 指値'+pxS(a.px):' → 成行')}[o.type];
 const kn={cash:'現物',mo:'信用新規',mc:'信用返済'}[o.kind];
 $('sheet').innerHTML=`<div class="grab"></div><h2 style="margin:4px 0">注文確認</h2>
 <div class="kv"><span>銘柄</span><b>${c.name} (${ccode(c)})</b></div><div class="kv"><span>取引</span><b class="${buy?'up':'dn'}">${kn} ${buy?'買い':'売り'}</b></div>

 ${o.kind==='cash'?`<div class="kv"><span>口座</span><b>${o.acc==='n'?'NISA':'特定'}</b></div>`:''}<div class="kv"><span>概算代金</span><b>${yen(a.qty*ordEst())}円</b></div>

 const typ=o=>({mkt:'成行',lim:'指値 '+pxS(o.px),stp:'逆指値 '+pxS(o.trig)+(o.px?'→'+pxS(o.px):'')}[o.type]);
 const row=(o,act)=>{const c=co(o.cid);return `<div class="row"><div class="nm"><b>${c?c.name:'?'}</b><span class="mut"><span class="pill ${o.side>0?'r':'b'}">${kn(o)}</span>${typ(o)} ・ ${o.valid==='wk'?'今週中':'当日'}</span></div><div class="r"><b style="font-size:13px">${yen(o.filled)}/${yen(o.qty)}株</b><span class="mut">${act?'':{done:'約定',cxl:'取消/失効'}[o.st]||''}${o.filled?' 平均'+pxS(o.avg):''}</span></div>${act?`<button class="btn gr" style="width:56px;padding:6px;font-size:12px" onclick="doCancel(${o.id})">取消</button>`:''}</div>`;};
 const fl=C.fills.slice(0,40);
 return `${hdr('注文照会')}<div class="bd"><div class="seg">${[['open','注文中'+(open.length?`(${open.length})`:'')],['his','注文履歴'],['fill','約定履歴']].map(([k,l])=>`<button class="${ct.tr===k?'on':''}" onclick="ct.tr='${k}';renderCit()">${l}</button>`).join('')}</div>
 ${ct.tr==='open'?(open.length?open.map(o=>row(o,1)).join(''):'<div class="news mut">注文中の注文はありません</div>'):ct.tr==='his'?dn.map(o=>row(o,0)).join('')||'<div class="news mut">履歴がありません</div>':
 fl.map(f=>{const x=dInfo(f.dn);return `<div class="row"><div class="nm"><b>${f.name}</b><span class="mut">${x.m}/${x.d} ${tLabel(f.k)} ・ <span class="pill ${f.side>0?'r':'b'}">${{cash:'現物',mo:'信用新規',mc:'信用返済'}[f.kind]}${f.side>0?'買':'売'}</span>${f.forced?'強制決済':''}</span></div><div class="r"><b style="font-size:13px">${yen(f.n)}株 @${pxS(f.px)}</b>${f.pnl!=null?`<span class="${cc(f.pnl)}" style="font-size:12px">損益 ${sgn(f.pnl)}</span>`:`<span class="mut">${yen(f.amt)}円</span>`}</div></div>`;}).join('')||'<div class="news mut">約定履歴がありません</div>'}</div>`;}

 else if(ct.as==='fund'){const F=C.fund,v=fundValue();

function holdOf(o){if(o.side<=0)return null;if(o.kind==='cash'){const P=G.cit.pos[o.cid];if(P&&P[o.acc].n>0)return {n:P[o.acc].n,cost:P[o.acc].cost};}
 else if(o.kind==='mo'){const m=G.cit.mg[o.cid];if(m&&m.side>0)return {n:m.n,cost:m.avg*m.n};}return null;}
function nanBtns(o){const h=holdOf(o);if(!h)return '';const c=co(o.cid),px=cpx(c),a0=h.cost/h.n;if(px>=a0)return '';
 return `<div class="lb">ナンピン(買い増しで平均取得単価を下げる)</div><div class="osw"><button onclick="nanQty(1)">同数買い増し</button><button onclick="nanTarget(.03)">平均−3%</button><button onclick="nanTarget(.06)">平均−6%</button><button onclick="nanTarget(.1)">平均−10%</button></div>`;}
function nanQty(f){const h=holdOf(ct.o);if(!h)return;ct.o.qty=Math.max(LOT,Math.round(h.n*f/LOT)*LOT);drawOrder();}
function nanTarget(d){const h=holdOf(ct.o);if(!h)return;const c=co(ct.o.cid),p=ordEst()||cpx(c),a0=h.cost/h.n,t=a0*(1-d);
 if(p>=t){toast('現在値がその目標平均より高いため、その値までは下がりません','err');return;}
 const q=(h.cost-t*h.n)/(t-p);ct.o.qty=Math.max(LOT,Math.ceil(q/LOT)*LOT);drawOrder();}
function nanpin(cid,acc){const C=G.cit,P=C.pos[cid];openOrder(cid,'cash',1);if(!P)return;
 const a=acc||(P.t.n>0&&P.t.cost/P.t.n>=P.n.cost/Math.max(1,P.n.n)?'t':P.n.n>0?'n':'t');ct.o.acc=a;
 const h=holdOf(ct.o);if(h)ct.o.qty=Math.max(LOT,Math.round(h.n/LOT)*LOT);drawOrder();}

 const c=$('twcap');if(c)c.textContent=townCap(st);const sl=$('twsl');if(sl){sl.max=L.length-1;sl.value=TW.i;}}
function townPlay(){if(TW.timer){clearInterval(TW.timer);TW.timer=null;const b=$('twplay');if(b)b.textContent='▶ 再生';return;}
 const L=townList();if(L.length<2)return;if(TW.i>=L.length-1)TW.i=0;$('twplay').textContent='■ 停止';
 TW.timer=setInterval(()=>{if(!$('twcv')){clearInterval(TW.timer);TW.timer=null;return;}const n=townList().length;if(TW.i>=n-1){townPlay();return;}townShow(TW.i+1);},350);}
function townCard(){const L=townList();return `<div class="card"><h3>街のアルバム</h3><canvas id="twcv" style="width:100%;aspect-ratio:16/9;image-rendering:pixelated;border-radius:8px;display:block;background:#000"></canvas>
 <div id="twcap" class="mut" style="font-size:12.5px;margin:6px 0"></div>
 <input id="twsl" type="range" min="0" max="${Math.max(0,L.length-1)}" value="${Math.max(0,L.length-1)}" style="width:100%" oninput="townShow(+this.value)">
 <div class="chips" style="margin-top:6px"><button class="btn tonal sm" onclick="townShow(TW.i-1)">◀ 前年</button><button id="twplay" class="btn tonal sm" onclick="townPlay()">▶ 再生</button><button class="btn tonal sm" onclick="townShow(TW.i+1)">翌年 ▶</button><button class="btn tonal sm" onclick="townShow(9999)">今</button></div></div>`;}
const _vh0=viewHome;viewHome=function(){if(TW.timer){clearInterval(TW.timer);TW.timer=null;}_vh0();const v=$('view');if(!v)return;v.insertAdjacentHTML('afterbegin',townCard());setTimeout(()=>townShow(9999),0);};

const _pm0=polMood;polMood=function(){const h=_pm0();return typeof crimeCard==='function'?h.replace('<div class="grid"><div>','<div class="grid"><div>'+crimeCard()+(typeof stressCard==='function'?stressCard():'')):h;};

const _fc0=fundCard;fundCard=function(){return (typeof oppMoreCard==='function'?oppMoreCard():'')+_fc0();};

const _fc2=fundCard;fundCard=function(){return (typeof cvCard==='function'?cvCard():'')+_fc2();};

const _cx1=coExtra;coExtra=function(c){return (typeof staffBox==='function'?staffBox(c):'')+_cx1(c);};

(function(){
 applyTheme();bindControls();
 let loaded=false;
 try{const s=localStorage.getItem('mizuho_save2');if(s){const g=JSON.parse(s);if(g&&g.ver===2&&g.companies&&g.pol&&g.reg){G=g;loaded=true;}}}catch(e){}
 if(loaded&&!G.fraud){G.fraud={heat:0,gerry:0,exposed:0};G.camp=newCamp();G.elect=null;}
 if(loaded){migrateG();if(!G.cur)curInit();if(!G.priv)insInit();if(!G.media)mediaInit();if(!G.fm)fmInit();if(!G.funds)fundInit();if(!G.mood)moodInit();if(!G.mac)macInit();POL.forEach(o=>{if(G.pl[o.k]==null)G.pl[o.k]=o.d0;});CU=G.cur.unit||'円';}
 if(!loaded)newGame('seiyu');
 emojiStart();renderAll();
 if(!loaded)showStart();else if(G.over)showOver();else if(G.elect)showElection();
})();
